      const pos = getTouchPos(touch);
      const deltaY = pos.y - game.initialsTouchStart;
      
      if (Math.abs(deltaY) > 30) {
        const direction = deltaY > 0 ? -1 : 1;
        const currentChar = game.initials[game.initialsTouchLetter];
        let index = game.initialsChars.indexOf(currentChar);
        index += direction;
        if (index >= game.initialsChars.length) index = 0;
        if (index < 0) index = game.initialsChars.length - 1;
        game.initials[game.initialsTouchLetter] = game.initialsChars[index];
        game.initialsTouchStart = pos.y;
        game.audio.playSelect();
      }
    }, { passive: true });
    
    canvas.addEventListener('touchend', (e) => {
      game.initialsTouchStart = null;
      game.initialsTouchLetter = -1;
    }, { passive: true });
  }

  // Demo mode
  startDemo() {
    this.state = GameState.DEMO;
    this.demoPlayer = new Player(CONFIG.WIDTH / 2, CONFIG.HEIGHT - 100);
    this.demoPlayer.lives = 999;
    this.demoBullets = [];
    this.demoMissiles = [];
    this.demoEnemies = [];
    this.demoParticles = [];
    this.demoPowerUps = [];
    this.demoBombWaves = [];
    this.demoTexts = [];
    this.demoTime = 0;
    this.demoSpawnTimer = 0;
    this.demoPowerUpTimer = 0;
    this.demoTargetX = CONFIG.WIDTH / 2;
    this.demoTargetY = CONFIG.HEIGHT - 100;
    this.demoPendingAction = null;
    this.demoPendingTimer = 0;
  }

  updateDemo(dt) {
    if (!this.demoPlayer) {
      this.startDemo();
      return;
    }
    
    this.demoTime += dt;
    
    // Update background
    this.backgroundStars.forEach(star => star.update(dt, 0.8));
    
    // Limit arrays
    if (this.demoBullets.length > 100) {
      this.demoBullets = this.demoBullets.slice(-50);
    }
    if (this.demoParticles.length > 200) {
      this.demoParticles = this.demoParticles.slice(-100);
    }
    if (this.demoEnemies.length > 20) {
      this.demoEnemies = this.demoEnemies.slice(-10);
    }
    
    // Execute pending actions
    if (this.demoPendingAction) {
      this.demoPendingTimer -= dt;
      if (this.demoPendingTimer <= 0) {
        try {
          if (this.demoPendingAction === 'bomb' && this.demoPlayer.bombs > 0) {
            this.demoPlayer.bombs--;
            this.demoBombWaves.push(new BombWave(this.demoPlayer.x, this.demoPlayer.y));
            this.audio.playBomb();
            
            this.demoEnemies.forEach(enemy => {
              if (enemy) {
                for (let i = 0; i < 15; i++) {
                  this.demoParticles.push(new Particle(enemy.x, enemy.y));
                }
              }
            });
            this.demoEnemies = [];
            
            this.demoTexts.push({
              text: 'DESTRUYE TODO EN PANTALLA!',
              x: CONFIG.WIDTH / 2,
              y: CONFIG.HEIGHT / 2,
              color: '#f80',
              life: 2.5,
              vy: -30
            });
          } else if (this.demoPendingAction === 'missile' && this.demoPlayer.missiles > 0) {
            const count = Math.min(this.demoPlayer.missiles, 3);
            for (let i = 0; i < count; i++) {
              const offset = (i - (count - 1) / 2) * 30;
              this.demoMissiles.push(new HomingMissile(
                this.demoPlayer.x + offset,
                this.demoPlayer.y - this.demoPlayer.height / 2
              ));
              this.demoPlayer.missiles--;
            }
            this.audio.playMissile();
            this.demoTexts.push({
              text: 'PERSIGUEN ENEMIGOS!',
              x: CONFIG.WIDTH / 2,
              y: this.demoPlayer.y - 80,
              color: '#0af',
              life: 2.5,
              vy: -40
            });
          } else if (this.demoPendingAction === 'cannon') {
            this.demoTexts.push({
              text: 'MAS POTENCIA DE FUEGO!',
              x: CONFIG.WIDTH / 2,
              y: this.demoPlayer.y - 60,
              color: '#0f0',
              life: 2.5,
              vy: -40
            });
          }
        } catch (e) {}
        
        this.demoPendingAction = null;
      }
    }
    
    // AI movement
    let targetSet = false;
    for (let i = 0; i < this.demoPowerUps.length; i++) {
      const powerUp = this.demoPowerUps[i];
      if (powerUp && powerUp.y > 100 && powerUp.y < CONFIG.HEIGHT - 150) {
        this.demoTargetX = powerUp.x;
        this.demoTargetY = powerUp.y + 60;
        targetSet = true;
        break;
      }
    }
    
    if (!targetSet) {
      this.demoTargetX = CONFIG.WIDTH / 2 + Math.sin(this.demoTime * 1.5) * 150;
      this.demoTargetY = CONFIG.HEIGHT - 120 + Math.sin(this.demoTime * 2) * 40;
    }
    
    const dx = this.demoTargetX - this.demoPlayer.x;
    const dy = this.demoTargetY - this.demoPlayer.y;
    
    this.demoPlayer.x += dx * dt * 3;
    this.demoPlayer.y += dy * dt * 3;
    
    const fullWidth = this.demoPlayer.getFullWidth() / 2;
    this.demoPlayer.x = Math.max(fullWidth, Math.min(CONFIG.WIDTH - fullWidth, this.demoPlayer.x));
    this.demoPlayer.y = Math.max(50, Math.min(CONFIG.HEIGHT - 50, this.demoPlayer.y));
    
    // Shooting
    if (this.demoPlayer.fireTimer > 0) {
      this.demoPlayer.fireTimer -= 1000 * dt;
    }
    
    if (this.demoPlayer.fireTimer <= 0) {
      this.demoPlayer.fireTimer = CONFIG.FIRE_RATE;
      
      const pattern = this.demoPlayer.getBulletPattern();
      pattern.forEach(p => {
        this.demoBullets.push(new Bullet(
          this.demoPlayer.x + p.offsetX,
          this.demoPlayer.y - this.demoPlayer.height / 2 + p.offsetY,
          p.vx,
          p.vy
        ));
      });
      
      this.demoPlayer.modules.forEach(mod => {
        if (mod.hasCannon) {
          this.demoBullets.push(new Bullet(
            this.demoPlayer.x + mod.offsetX,
            this.demoPlayer.y + mod.offsetY - mod.height / 2,
            0,
            -CONFIG.BULLET_SPEED
          ));
        }
      });
    }
    
    // Spawn enemies
    this.demoSpawnTimer += 1000 * dt;
    if (this.demoSpawnTimer >= 1200 && this.demoEnemies.length < 10) {
      this.demoSpawnTimer = 0;
      const x = Math.random() * (CONFIG.WIDTH - 60) + 30;
      const types = ['kamikaze', 'wave', 'kamikaze'];
      const type = types[Math.floor(Math.random() * types.length)];
      this.demoEnemies.push(new Enemy(x, -30, type));
    }
    
    // Spawn power-ups
    this.demoPowerUpTimer += dt;
    if (this.demoPowerUpTimer >= 4 && !this.demoPendingAction && this.demoPowerUps.length < 3) {
      this.demoPowerUpTimer = 0;
      const types = ['power', 'missile', 'bomb'];
      const type = types[Math.floor(Math.random() * types.length)];
      const x = this.demoTargetX + (Math.random() - 0.5) * 100;
      this.demoPowerUps.push(new PowerUp(
        Math.max(30, Math.min(CONFIG.WIDTH - 30, x)),
        -20,
        type
      ));
    }
    
    // Update power-ups
    for (let i = this.demoPowerUps.length - 1; i >= 0; i--) {
      const powerUp = this.demoPowerUps[i];
      if (!powerUp) continue;
      powerUp.update(dt);
      if (powerUp.isOffScreen()) {
        this.demoPowerUps.splice(i, 1);
      }
    }
    
    // Check power-up collection
    for (let i = this.demoPowerUps.length - 1; i >= 0; i--) {
      const powerUp = this.demoPowerUps[i];
      if (!powerUp) continue;
      
      const dx = powerUp.x - this.demoPlayer.x;
      const dy = powerUp.y - this.demoPlayer.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < 40) {
        let text = '';
        let color = '#fff';
        
        if (powerUp.type === 'power') {
          this.demoPlayer.evolve();
          text = 'CANON EXTRA!';
          color = '#0f0';
          
          for (let j = 0; j < 10; j++) {
            this.demoParticles.push(new Particle(this.demoPlayer.x, this.demoPlayer.y));
          }
          
          this.demoPendingAction = 'cannon';
          this.demoPendingTimer = 0.8;
        } else if (powerUp.type === 'missile') {
          this.demoPlayer.addMissiles(3);
          text = 'MISILES RASTREADORES!';
          color = '#0af';
          this.demoPendingAction = 'missile';
          this.demoPendingTimer = 0.5;
        } else if (powerUp.type === 'bomb') {
          this.demoPlayer.addBombs(1);
          text = 'BOMBA!';
          color = '#f80';
          this.demoPendingAction = 'bomb';
          this.demoPendingTimer = 0.8;
        }
        
        this.demoTexts.push({
          text: text,
          x: powerUp.x,
          y: powerUp.y,
          color: color,
          life: 2,
          vy: -50
        });
        
        this.demoPowerUps.splice(i, 1);
      }
    }
    
    // Update texts
    for (let i = this.demoTexts.length - 1; i >= 0; i--) {
      const text = this.demoTexts[i];
      if (!text) continue;
      text.y += text.vy * dt;
      text.life -= dt;
      if (text.life <= 0) {
        this.demoTexts.splice(i, 1);
      }
    }
    
    // Update bomb waves
    for (let i = this.demoBombWaves.length - 1; i >= 0; i--) {
      const wave = this.demoBombWaves[i];
      if (!wave) continue;
      wave.update(dt);
      if (wave.isDead()) {
        this.demoBombWaves.splice(i, 1);
      }
    }
    
    // Reset if too evolved or too long
    if (this.demoPlayer.evolutionLevel >= CONFIG.MAX_EVOLUTION || this.demoTime > 60) {
      this.demoPowerUpTimer = -10;
      if (this.demoTime > 35) {
        this.startDemo();
        return;
      }
    }
    
    // Update bullets
    for (let i = this.demoBullets.length - 1; i >= 0; i--) {
      const bullet = this.demoBullets[i];
      if (!bullet) {
        this.demoBullets.splice(i, 1);
        continue;
      }
      bullet.update(dt);
      if (bullet.isOffScreen()) {
        this.demoBullets.splice(i, 1);
      }
    }
    
    // Update missiles
    const validEnemies = this.demoEnemies.filter(e => e !== null);
    for (let i = this.demoMissiles.length - 1; i >= 0; i--) {
      const missile = this.demoMissiles[i];
      if (!missile) {
        this.demoMissiles.splice(i, 1);
        continue;
      }
      missile.update(dt, validEnemies);
      if (missile.isOffScreen()) {
        this.demoMissiles.splice(i, 1);
      }
    }
    
    // Update enemies
    const demoGame = { enemyBullets: [] };
    for (let i = this.demoEnemies.length - 1; i >= 0; i--) {
      const enemy = this.demoEnemies[i];
      if (!enemy) {
        this.demoEnemies.splice(i, 1);
        continue;
      }
      enemy.update(dt, demoGame);
      if (enemy.isOffScreen()) {
        this.demoEnemies.splice(i, 1);
      }
    }
    
    // Update particles
    for (let i = this.demoParticles.length - 1; i >= 0; i--) {
      const particle = this.demoParticles[i];
      if (!particle) {
        this.demoParticles.splice(i, 1);
        continue;
      }
      particle.update(dt);
      if (particle.isDead()) {
        this.demoParticles.splice(i, 1);
      }
    }
    
    // Collision detection - bullets vs enemies
    for (let b = this.demoBullets.length - 1; b >= 0; b--) {
      const bullet = this.demoBullets[b];
      if (!bullet) continue;
      
      for (let e = this.demoEnemies.length - 1; e >= 0; e--) {
        const enemy = this.demoEnemies[e];
        if (!enemy) continue;
        
        const bb = bullet.getBounds();
        const eb = enemy.getBounds();
        
        if (bb.x < eb.x + eb.width && bb.x + bb.width > eb.x &&
            bb.y < eb.y + eb.height && bb.y + bb.height > eb.y) {
          this.demoBullets.splice(b, 1);
          enemy.health--;
          
          for (let i = 0; i < 3; i++) {
            this.demoParticles.push(new Particle(bullet.x, bullet.y));
          }
          
          if (enemy.health <= 0) {
            for (let i = 0; i < 8; i++) {
              this.demoParticles.push(new Particle(enemy.x, enemy.y));
            }
            this.demoEnemies.splice(e, 1);
          }
          break;
        }
      }
    }
    
    // Collision detection - missiles vs enemies
    for (let m = this.demoMissiles.length - 1; m >= 0; m--) {
      const missile = this.demoMissiles[m];
      if (!missile) continue;
      
      for (let e = this.demoEnemies.length - 1; e >= 0; e--) {
        const enemy = this.demoEnemies[e];
        if (!enemy) continue;
        
        const mb = missile.getBounds();
        const eb = enemy.getBounds();
        
        if (mb.x < eb.x + eb.width && mb.x + mb.width > eb.x &&
            mb.y < eb.y + eb.height && mb.y + mb.height > eb.y) {
          this.demoMissiles.splice(m, 1);
          enemy.health -= 2;
          
          for (let i = 0; i < 6; i++) {
            this.demoParticles.push(new Particle(missile.x, missile.y));
          }
          
          this.audio.playExplosion();
          
          if (enemy.health <= 0) {
            for (let i = 0; i < 10; i++) {
              this.demoParticles.push(new Particle(enemy.x, enemy.y));
            }
            this.demoEnemies.splice(e, 1);
          }
          break;
        }
      }
    }
  }

  drawDemo(ctx) {
    // Background
    this.backgroundStars.forEach(star => star.draw(ctx, 0.3));
    
    // Bomb waves
    this.demoBombWaves.forEach(wave => wave.draw(ctx));
    
    // Particles
    this.demoParticles.forEach(particle => particle.draw(ctx));
    
    // Power-ups
    this.demoPowerUps.forEach(powerUp => powerUp.draw(ctx));
    
    // Bullets
    this.demoBullets.forEach(bullet => bullet.draw(ctx));
    
    // Missiles
    this.demoMissiles.forEach(missile => missile.draw(ctx));
    
    // Enemies
    this.demoEnemies.forEach(enemy => enemy.draw(ctx));
    
    // Player
    if (this.demoPlayer) {
      this.demoPlayer.draw(ctx);
    }
    
    // Floating texts
    this.demoTexts.forEach(text => {
      ctx.save();
      ctx.globalAlpha = Math.min(1, text.life);
      ctx.fillStyle = text.color;
      ctx.font = 'bold 18px Courier New';
      ctx.textAlign = 'center';
      ctx.shadowColor = text.color;
      ctx.shadowBlur = 10;
      ctx.fillText(text.text, text.x, text.y);
      ctx.restore();
    });
    
    // Demo UI overlay
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(0, 0, CONFIG.WIDTH, 70);
    ctx.fillRect(0, CONFIG.HEIGHT - 50, CONFIG.WIDTH, 50);
    
    ctx.fillStyle = '#0ff';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 15;
    ctx.font = 'bold 28px Courier New';
    ctx.fillText('GALLEGHER STARSHIP', CONFIG.WIDTH / 2, 35);
    
    ctx.shadowBlur = 0;
    ctx.font = '12px Courier New';
    ctx.fillStyle = '#ff0';
    ctx.fillText('★★★ DEMO ★★★', CONFIG.WIDTH / 2, 55);
    
    ctx.fillStyle = '#0ff';
    ctx.font = '14px Courier New';
    const cannons = this.demoPlayer ? this.demoPlayer.countCannonsPerSide() : { left: 0, right: 0 };
    const missiles = this.demoPlayer ? this.demoPlayer.missiles : 0;
    const bombs = this.demoPlayer ? this.demoPlayer.bombs : 0;
    ctx.fillText(`LV.${this.demoPlayer ? this.demoPlayer.evolutionLevel : 1} | ${cannons.left}L/${cannons.right}R | M:${missiles} | B:${bombs}`, 
      CONFIG.WIDTH / 2, CONFIG.HEIGHT - 30);
    
    if (Math.sin(Date.now() / 400) > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = '16px Courier New';
      ctx.fillText('TOCA O PRESIONA PARA JUGAR', CONFIG.WIDTH / 2, CONFIG.HEIGHT - 10);
    }
  }

  // Game management
  startGame() {
    this.audio.init();
    this.menuIdleTimer = 0;
    this.state = GameState.PLAYING;
    this.score = 0;
    this.incrementPlayCount();
    this.gameTime = 0;
    this.spawnInterval = CONFIG.ENEMY_SPAWN_INITIAL;
    
    this.player = new Player(CONFIG.WIDTH / 2, CONFIG.HEIGHT - 80);
    this.bullets = [];
    this.missiles = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.particles = [];
    this.powerUps = [];
    this.bombWaves = [];
    
    this.screenFlash = 0;
    this.finalPhaseActive = false;
    this.finalPhaseStartScore = 0;
    this.finalPhasePointsRemaining = CONFIG.FINAL_PHASE_POINTS;
    
    this.startDebounce = true;
    setTimeout(() => this.startDebounce = false, 500);
    
    if (this.input.isMobile && !this.input.gyroEnabled) {
      this.input.requestGyroPermission();
    }
    
    this.input.isFirstTouch = true;
    
    playGameplayMusic();
  }

  spawnEnemy() {
    const x = Math.random() * (CONFIG.WIDTH - 60) + 30;
    let type = 'kamikaze';
    const rand = Math.random();
    
    if (this.gameTime > 30 && rand < 0.15) {
      type = 'tank';
    } else if (rand < 0.4) {
      type = 'wave';
    }
    
    this.enemies.push(new Enemy(x, -30, type));
  }

  createExplosion(x, y, count = 15, color = '#0ff') {
    for (let i = 0; i < count; i++) {
      this.particles.push(new Particle(x, y, color));
    }
  }

  useBomb() {
    if (!this.player.canUseBomb()) return;
    if (!this.player.useBomb()) return;
    
    this.audio.playBomb();
    this.bombWaves.push(new BombWave(this.player.x, this.player.y));
    this.screenFlash = 1;
    
    this.enemies.forEach(enemy => {
      this.createExplosion(enemy.x, enemy.y, 20);
      const points = enemy.type === 'kamikaze' ? 100 : 
                     enemy.type === 'wave' ? 150 : 300;
      this.addScore(points);
    });
    
    this.enemies = [];
    
    this.enemyBullets.forEach(bullet => {
      this.createExplosion(bullet.x, bullet.y, 3);
    });
    this.enemyBullets = [];
    
    this.screenShake(15, 0.4);
  }

  addScore(points) {
    this.score += points;
    if (this.finalPhaseActive) {
      this.finalPhasePointsRemaining -= points;
    }
  }

  screenShake(amount, duration) {
    this.shakeAmount = Math.max(this.shakeAmount, amount);
    this.shakeDuration = Math.max(this.shakeDuration, duration);
  }

  checkCollision(obj1, obj2) {
    const b1 = obj1.getBounds();
    const b2 = obj2.getBounds();
    return b1.x < b2.x + b2.width && 
           b1.x + b1.width > b2.x && 
           b1.y < b2.y + b2.height && 
           b1.y + b1.height > b2.y;
  }

  activateFinalPhase() {
    if (this.finalPhaseActive) return;
    
    this.finalPhaseActive = true;
    this.finalPhaseStartScore = this.score;
    this.finalPhasePointsRemaining = CONFIG.FINAL_PHASE_POINTS;
    this.audio.playFinalPhase();
    this.screenShake(15, 0.5);
    this.screenFlash = 0.8;
  }

  startInterstellar() {
    this.state = GameState.INTERSTELLAR;
    this.interstellarTimer = 0;
    this.player.canShoot = false;
    this.audio.playInterstellar();
    this.screenShake(8, 0.5);
    
    this.enemies.forEach(enemy => {
      this.createExplosion(enemy.x, enemy.y, 10);
    });
    this.enemies = [];
    this.enemyBullets = [];
    this.bullets = [];
    this.missiles = [];
  }

  transitionToVictory() {
    this.state = GameState.VICTORY;
    this.audio.playVictory();
    this.victoryAnimTimer = 0;
    this.wasVictory = true;
    this.screenShake(12, 0.8);
    this.incrementVictories();
    playVictoryMusic();
  }

  transitionToScoreEntry() {
    this.input.touchStartPressed = false;
    this.input.touchBombPressed = false;
    this.input.touchActive = false;
    this.pendingInitialsConfirm = false;
    this.initialsTouchStart = null;
    this.initialsTouchLetter = -1;
    
    if (this.isHighScore(this.score)) {
      this.state = GameState.ENTER_INITIALS;
      this.initials = ['A', 'A', 'A'];
      this.initialsPosition = 0;
      this.scoreRank = this.getScoreRank(this.score);
      this.startDebounce = true;
      setTimeout(() => this.startDebounce = false, 1500);
    } else {
      this.state = GameState.SHOW_SCORES;
      this.startDebounce = true;
      setTimeout(() => this.startDebounce = false, 500);
    }
  }

  update(dt) {
    // Screen flash
    if (this.screenFlash > 0) {
      this.screenFlash -= 3 * dt;
    }
    
    // Menu state
    if (this.state === GameState.MENU) {
      this.backgroundStars.forEach(star => star.update(dt, 0.5));
      
      this.menuIdleTimer += dt;
      if (this.input.isStartPressed() || 
          this.input.getMovement().dx !== 0 || 
          this.input.getMovement().dy !== 0) {
        this.menuIdleTimer = 0;
      }
      
      if (this.menuIdleTimer >= this.demoModeDelay) {
        this.startDemo();
        return;
      }
      
      if (this.input.isStartPressed() && !this.startDebounce) {
        this.startGame();
      }
      return;
    }
    
    // Demo state
    if (this.state === GameState.DEMO) {
      this.updateDemo(dt);
      if (this.input.isStartPressed() || this.input.touchStartPressed) {
        this.state = GameState.MENU;
        this.menuIdleTimer = 0;
        this.startDebounce = true;
        setTimeout(() => this.startDebounce = false, 300);
      }
      return;
    }
    
    // Show scores state
    if (this.state === GameState.SHOW_SCORES) {
      if (this.input.isStartPressed() && !this.startDebounce) {
        this.state = GameState.MENU;
        stopAllMusic();
        this.startDebounce = true;
        setTimeout(() => this.startDebounce = false, 500);
      }
      return;
    }
    
    // Enter initials state
    if (this.state === GameState.ENTER_INITIALS) {
      this.initialsBlinkTimer += dt;
      this.updateInitialsInput();
      return;
    }
    
    // Interstellar state
    if (this.state === GameState.INTERSTELLAR) {
      this.interstellarTimer += dt;
      const warpSpeed = 1 + this.interstellarTimer * 2;
      
      this.starStreaks.forEach(streak => streak.update(dt, warpSpeed));
      
      const centerX = CONFIG.WIDTH / 2;
      const centerY = CONFIG.HEIGHT / 2;
      this.player.x += (centerX - this.player.x) * dt * 2;
      this.player.y += (centerY - this.player.y) * dt * 2;
      
      this.particles.forEach(particle => particle.update(dt));
      this.particles = this.particles.filter(p => !p.isDead());
      
      if (this.shakeDuration > 0) {
        this.shakeDuration -= dt;
      } else {
        this.shakeAmount = 0;
      }
      
      if (this.interstellarTimer >= this.interstellarDuration) {
        this.transitionToVictory();
      }
      return;
    }
    
    // Game over state
    if (this.state === GameState.GAME_OVER) {
      this.victoryAnimTimer += dt;
      this.backgroundStars.forEach(star => star.update(dt, 0.3));
      this.particles.forEach(particle => particle.update(dt));
      this.particles = this.particles.filter(p => !p.isDead());
      this.bombWaves.forEach(wave => wave.update(dt));
      this.bombWaves = this.bombWaves.filter(w => !w.isDead());
      
      if (this.shakeDuration > 0) {
        this.shakeDuration -= dt;
      } else {
        this.shakeAmount = 0;
      }
      
      if (this.input.isStartPressed() && !this.startDebounce && this.victoryAnimTimer > 2) {
        this.transitionToScoreEntry();
      }
      return;
    }
    
    // Victory state
    if (this.state === GameState.VICTORY) {
      this.victoryAnimTimer += dt;
      this.starStreaks.forEach(streak => streak.update(dt, 0.3));
      this.particles.forEach(particle => particle.update(dt));
      this.particles = this.particles.filter(p => !p.isDead());
      
      if (this.shakeDuration > 0) {
        this.shakeDuration -= dt;
      } else {
        this.shakeAmount = 0;
      }
      
      if (this.victoryAnimTimer >= CONFIG.VICTORY_DISPLAY_TIME) {
        this.transitionToScoreEntry();
      }
      return;
    }
    
    // Playing state
    this.gameTime += dt;
    
    // Update warp intensity
    const targetWarp = this.finalPhaseActive ? 0.5 : 0;
    this.warpIntensity += (targetWarp - this.warpIntensity) * dt * 2;
    
    const warpMult = 1 + this.warpIntensity * 3;
    this.backgroundStars.forEach(star => star.update(dt, warpMult));
    
    // Update player
    this.player.update(dt, this.input);
    
    // Player shooting
    if (this.input.isShooting() && this.player.canShoot) {
      const { bullets, missiles } = this.player.shoot();
      if (bullets.length > 0) {
        this.audio.playShoot();
        this.bullets.push(...bullets);
      }
      if (missiles.length > 0) {
        this.audio.playMissile();
        this.missiles.push(...missiles);
      }
    }
    
    // Player bomb
    if (this.input.isBombPressed() && this.player.canShoot) {
      this.useBomb();
    }
    
    // Spawn enemies
    if (!this.finalPhaseActive || this.finalPhasePointsRemaining > 0) {
      this.spawnTimer += 1000 * dt;
      this.spawnInterval = Math.max(
        CONFIG.ENEMY_SPAWN_MIN,
        CONFIG.ENEMY_SPAWN_INITIAL - this.gameTime * 25
      );
      
      if (this.spawnTimer >= this.spawnInterval) {
        this.spawnTimer = 0;
        this.spawnEnemy();
        
        if (this.gameTime > 60 && Math.random() < 0.3) {
          this.spawnEnemy();
        }
      }
    }
    
    // Check for interstellar transition
    if (this.finalPhaseActive && this.finalPhasePointsRemaining <= 0) {
      this.startInterstellar();
      return;
    }
    
    // Update bullets
    this.bullets.forEach(bullet => bullet.update(dt));
    this.bullets = this.bullets.filter(b => !b.isOffScreen());
    
    // Update missiles
    this.missiles.forEach(missile => missile.update(dt, this.enemies));
    this.missiles = this.missiles.filter(m => !m.isOffScreen());
    
    // Update enemy bullets
    this.enemyBullets.forEach(bullet => bullet.update(dt));
    this.enemyBullets = this.enemyBullets.filter(b => !b.isOffScreen());
    
    // Update enemies
    this.enemies.forEach(enemy => enemy.update(dt, this));
    this.enemies = this.enemies.filter(e => !e.isOffScreen());
    
    // Update power-ups
    this.powerUps.forEach(powerUp => powerUp.update(dt));
    this.powerUps = this.powerUps.filter(p => !p.isOffScreen());
    
    // Update particles
    this.particles.forEach(particle => particle.update(dt));
    this.particles = this.particles.filter(p => !p.isDead());
    
    // Update bomb waves
    this.bombWaves.forEach(wave => wave.update(dt));
    this.bombWaves = this.bombWaves.filter(w => !w.isDead());
    
    // Update shake
    if (this.shakeDuration > 0) {
      this.shakeDuration -= dt;
    } else {
      this.shakeAmount = 0;
    }
    
    // Collision: bullets vs enemies
    this.bullets.forEach((bullet, bi) => {
      this.enemies.forEach((enemy, ei) => {
        if (this.checkCollision(bullet, enemy)) {
          this.bullets[bi] = null;
          enemy.health--;
          this.createExplosion(bullet.x, bullet.y, 3);
          
          if (enemy.health <= 0) {
            this.handleEnemyDeath(enemy, ei);
          }
        }
      });
    });
    this.bullets = this.bullets.filter(b => b !== null);
    
    // Collision: missiles vs enemies
    this.missiles.forEach((missile, mi) => {
      this.enemies.forEach((enemy, ei) => {
        if (this.checkCollision(missile, enemy)) {
          this.missiles[mi] = null;
          enemy.health -= 2;
          this.createExplosion(missile.x, missile.y, 8);
          this.audio.playExplosion();
          
          if (enemy.health <= 0) {
            this.handleEnemyDeath(enemy, ei);
          }
        }
      });
    });
    this.missiles = this.missiles.filter(m => m !== null);
    
    // Collision: player vs enemies
    if (!this.player.invulnerable) {
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        if (this.checkCollision(this.player, this.enemies[i])) {
          const enemy = this.enemies[i];
          this.createExplosion(enemy.x, enemy.y, 15);
          this.audio.playExplosion();
          this.enemies.splice(i, 1);
          
          if (this.player.takeDamage()) {
            this.gameOver();
            return;
          }
          
          this.audio.playHit();
          this.screenShake(10, 0.25);
        }
      }
    }
    
    // Collision: player vs enemy bullets
    if (!this.player.invulnerable) {
      for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
        if (this.checkCollision(this.player, this.enemyBullets[i])) {
          const bullet = this.enemyBullets[i];
          this.createExplosion(bullet.x, bullet.y, 5);
          this.enemyBullets.splice(i, 1);
          
          if (this.player.takeDamage()) {
            this.gameOver();
            return;
          }
          
          this.audio.playHit();
          this.screenShake(6, 0.15);
        }
      }
    }
    
    // Collision: player vs power-ups
    for (let i = this.powerUps.length - 1; i >= 0; i--) {
      if (this.checkCollision(this.player, this.powerUps[i])) {
        const powerUp = this.powerUps[i];
        
        if (powerUp.type === 'power') {
          const maxed = this.player.evolve();
          this.audio.playEvolution();
          this.screenShake(4, 0.1);
          this.addScore(100);
          this.createExplosion(this.player.x, this.player.y, 20);
          
          if (maxed && !this.finalPhaseActive) {
            this.activateFinalPhase();
          }
        } else if (powerUp.type === 'missile') {
          this.player.addMissiles(3 + Math.floor(this.player.evolutionLevel / 3));
          this.audio.playPowerUp();
          this.addScore(50);
        } else if (powerUp.type === 'bomb') {
          this.player.addBombs(1);
          this.audio.playPowerUp();
          this.addScore(75);
        }
        
        this.powerUps.splice(i, 1);
      }
    }
  }

  updateInitialsInput() {
    if (this.pendingInitialsConfirm) return;
    if (this.input.isMobile) return;
    
    if (this.input.isUpPressed()) {
      this.audio.playSelect();
      const char = this.initials[this.initialsPosition];
      let index = this.initialsChars.indexOf(char);
      index++;
      if (index >= this.initialsChars.length) index = 0;
      this.initials[this.initialsPosition] = this.initialsChars[index];
    }
    
    if (this.input.isDownPressed()) {
      this.audio.playSelect();
      const char = this.initials[this.initialsPosition];
      let index = this.initialsChars.indexOf(char);
      index--;
      if (index < 0) index = this.initialsChars.length - 1;
      this.initials[this.initialsPosition] = this.initialsChars[index];
    }
    
    if (this.input.isLeftPressed()) {
      this.audio.playSelect();
      this.initialsPosition--;
      if (this.initialsPosition < 0) this.initialsPosition = 2;
    }
    
    if (this.input.isRightPressed()) {
      this.audio.playSelect();
      this.initialsPosition++;
      if (this.initialsPosition > 2) this.initialsPosition = 0;
    }
    
    if (this.input.isConfirmPressed() && !this.startDebounce) {
      this.confirmInitials();
    }
  }

  handleEnemyDeath(enemy, index) {
    this.createExplosion(enemy.x, enemy.y, enemy.type === 'tank' ? 25 : 15);
    this.audio.playExplosion();
    this.screenShake(enemy.type === 'tank' ? 6 : 3, 0.12);
    
    const points = enemy.type === 'kamikaze' ? 100 : 
                   enemy.type === 'wave' ? 150 : 300;
    this.addScore(points);
    
    // Drop power-ups
    const dropChance = enemy.type === 'tank' ? 0.5 : 0.12;
    if (Math.random() < dropChance) {
      const rand = Math.random();
      let type;
      if (rand < 0.5) type = 'power';
      else if (rand < 0.8) type = 'missile';
      else type = 'bomb';
      
      this.powerUps.push(new PowerUp(enemy.x, enemy.y, type));
    }
    
    if (enemy.type === 'tank' && Math.random() < 0.4) {
      const rand = Math.random();
      let type;
      if (rand < 0.4) type = 'power';
      else if (rand < 0.7) type = 'missile';
      else type = 'bomb';
      
      this.powerUps.push(new PowerUp(enemy.x + 20, enemy.y, type));
    }
    
    this.enemies.splice(index, 1);
  }

  gameOver() {
    this.state = GameState.GAME_OVER;
    this.wasVictory = false;
    this.createExplosion(this.player.x, this.player.y, 40);
    this.audio.playExplosion();
    this.screenShake(20, 0.6);
    this.victoryAnimTimer = 0;
    this.incrementGameOvers();
    playGameOverMusic();
  }

  // Drawing methods
  draw() {
    const ctx = this.ctx;
    ctx.save();
    
    // Apply screen shake
    if (this.shakeDuration > 0 && this.shakeAmount > 0) {
      const shakeX = (Math.random() - 0.5) * this.shakeAmount * 2;
      const shakeY = (Math.random() - 0.5) * this.shakeAmount * 2;
      ctx.translate(shakeX, shakeY);
    }
    
    // Clear background
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    
    // Draw based on state
    if (this.state === GameState.MENU) {
      this.drawMenu(ctx);
    } else if (this.state === GameState.DEMO) {
      this.drawDemo(ctx);
    } else if (this.state === GameState.PLAYING) {
      this.drawGame(ctx);
    } else if (this.state === GameState.INTERSTELLAR) {
      this.drawInterstellar(ctx);
    } else if (this.state === GameState.GAME_OVER) {
      this.drawGame(ctx);
      this.drawGameOver(ctx);
    } else if (this.state === GameState.VICTORY) {
      this.drawVictory(ctx);
    } else if (this.state === GameState.ENTER_INITIALS) {
      this.drawEnterInitials(ctx);
    } else if (this.state === GameState.SHOW_SCORES) {
      this.drawHighScores(ctx);
    }
    
    // Screen flash
    if (this.screenFlash > 0) {
      ctx.fillStyle = `rgba(0, 255, 255, ${this.screenFlash * 0.7})`;
      ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    }
    
    ctx.restore();
  }

  drawDemoShip(ctx, x, y, evolutionLevel) {
    ctx.save();
    ctx.translate(x, y);
    
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 10;
    
    // Main ship
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(-14, 16);
    ctx.lineTo(14, 16);
    ctx.closePath();
    ctx.fill();
    
    // Modules
    const moduleCount = Math.floor((evolutionLevel - 1) / 2);
    for (let i = 0; i < moduleCount; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      const layer = Math.floor(i / 2);
      const mx = side * (26 + layer * 24);
      const my = 8 + layer * 4;
      
      ctx.fillRect(mx - 8, my - 10, 16, 20);
      
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#0ff';
      ctx.beginPath();
      ctx.moveTo(side * 28 / 2, 0);
      ctx.lineTo(mx, my);
      ctx.stroke();
    }
    
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  drawGame(ctx) {
    // Background
    this.backgroundStars.forEach(star => star.draw(ctx, this.warpIntensity));
    
    // Bomb waves
    this.bombWaves.forEach(wave => wave.draw(ctx));
    
    // Particles
    this.particles.forEach(particle => particle.draw(ctx));
    
    // Power-ups
    this.powerUps.forEach(powerUp => powerUp.draw(ctx));
    
    // Bullets
    this.bullets.forEach(bullet => bullet.draw(ctx));
    
    // Missiles
    this.missiles.forEach(missile => missile.draw(ctx));
    
    // Enemy bullets
    this.enemyBullets.forEach(bullet => bullet.draw(ctx));
    
    // Enemies
    this.enemies.forEach(enemy => enemy.draw(ctx));
    
    // Player
    if (this.player && this.state !== GameState.GAME_OVER) {
      this.player.draw(ctx);
    }
    
    // HUD
    this.drawHUD(ctx);
    
    // Final phase indicator
    if (this.finalPhaseActive && this.finalPhasePointsRemaining > 0) {
      this.drawFinalPhaseIndicator(ctx);
    }
  }

  drawFinalPhaseIndicator(ctx) {
    ctx.save();
    
    const flash = Math.sin(Date.now() / 150) > 0;
    ctx.fillStyle = flash ? '#ff0' : '#f80';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 10;
    ctx.fillText('FASE FINAL!', CONFIG.WIDTH / 2, 80);

    ctx.fillText(`${Math.max(0, this.finalPhasePointsRemaining)} PUNTOS`, CONFIG.WIDTH / 2, 100);
    
    ctx.restore();
  }

  drawInterstellar(ctx) {
    // Gradient background
    const gradient = ctx.createRadialGradient(
      CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2, 0,
      CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2, CONFIG.HEIGHT
    );
    gradient.addColorStop(0, '#001030');
    gradient.addColorStop(1, '#000010');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    
    // Star streaks
    const alpha = Math.min(1, this.interstellarTimer / 1.5);
    this.starStreaks.forEach(streak => streak.draw(ctx, alpha));
    
    // Warp tunnel lines
    ctx.save();
    ctx.strokeStyle = `rgba(100, 150, 255, ${alpha * 0.3})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + this.interstellarTimer;
      const innerRadius = 50 + this.interstellarTimer * 100;
      const outerRadius = 400 + this.interstellarTimer * 200;
      
      ctx.beginPath();
      ctx.moveTo(
        CONFIG.WIDTH / 2 + Math.cos(angle) * innerRadius,
        CONFIG.HEIGHT / 2 + Math.sin(angle) * innerRadius
      );
      ctx.lineTo(
        CONFIG.WIDTH / 2 + Math.cos(angle) * outerRadius,
        CONFIG.HEIGHT / 2 + Math.sin(angle) * outerRadius
      );
      ctx.stroke();
    }
    ctx.restore();
    
    // Particles
    this.particles.forEach(particle => particle.draw(ctx));
    
    // Player
    if (this.player) {
      ctx.save();
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 30 + alpha * 20;
      this.player.draw(ctx);
      ctx.restore();
    }
    
    // Title
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 24px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 15;
    
    const fadeIn = Math.min(1, this.interstellarTimer / 0.5);
    ctx.globalAlpha = fadeIn;
    ctx.fillText('VIAJE INTERESTELAR', CONFIG.WIDTH / 2, 80);
    ctx.globalAlpha = 1;
    
    ctx.shadowBlur = 0;
    
    // Progress bar
    const progress = this.interstellarTimer / this.interstellarDuration;
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(CONFIG.WIDTH / 2 - 100, CONFIG.HEIGHT - 60, 200, 20);
    ctx.fillStyle = '#0af';
    ctx.fillRect(CONFIG.WIDTH / 2 - 98, CONFIG.HEIGHT - 58, 196 * progress, 16);
  }

    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(50, 145);
    ctx.lineTo(CONFIG.WIDTH - 50, 145);
    ctx.stroke();
    
    ctx.font = '18px Courier New';
    
    const recentIndex = this.highScores.findIndex(
      entry => entry.initials === this.initials.join('') && entry.score === this.score
    );
    
    this.highScores.forEach((entry, i) => {
      const y = 180 + i * 40;
      const isRecent = i === recentIndex && this.score > 0;
      
      if (isRecent) {
        if (Math.sin(Date.now() / 200) > 0) {
          ctx.fillStyle = '#0ff';
          ctx.fillRect(45, y - 25, CONFIG.WIDTH - 90, 35);
          ctx.fillStyle = '#000';
        } else {
          ctx.fillStyle = '#ff0';
        }
      } else {
        ctx.fillStyle = '#0ff';
      }
      
      ctx.textAlign = 'left';
      ctx.fillText(`${(i + 1).toString().padStart(2, ' ')}.`, 60, y);
      ctx.fillText(entry.initials, 130, y);
      ctx.fillText(entry.score.toString().padStart(8, ' '), 210, y);
      
      ctx.textAlign = 'center';
      if (entry.victory) {
        ctx.fillText('★', 370, y);
      } else {
        ctx.fillStyle = isRecent ? ctx.fillStyle : '#444';
        ctx.fillText('-', 370, y);
      }
    });
    
    // Stats
    ctx.fillStyle = '#666';
    ctx.font = '10px Courier New';
    ctx.fillText(`PARTIDAS: ${this.stats.totalPlays} | VICTORIAS: ${this.stats.victories} | DERROTAS: ${this.stats.gameOvers}`,
      CONFIG.WIDTH / 2, CONFIG.HEIGHT - 60);
    
    // Press start
    ctx.fillStyle = '#0ff';
    ctx.font = '16px Courier New';
    if (Math.sin(Date.now() / 300) > 0) {
      ctx.fillText('PRESS START', CONFIG.WIDTH / 2, CONFIG.HEIGHT - 30);
    }
  }

  loop(timestamp) {
    const dt = Math.min((timestamp - this.lastTime) / 1000, 0.05);
    this.lastTime = timestamp;
    
    this.update(dt);
    this.draw();
    
    requestAnimationFrame(this.loop);
  }
}

// ========== INITIALIZATION ==========
function resizeCanvas() {
  const canvas = document.getElementById('gameCanvas');
  const container = document.querySelector('.game-container');
  
  const viewportWidth = (window.visualViewport ? window.visualViewport.width : window.innerWidth) - 8;
  const viewportHeight = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - 8;
  
  const aspectRatio = CONFIG.WIDTH / CONFIG.HEIGHT;
  
  let width, height;
  if (viewportWidth / viewportHeight > aspectRatio) {
    height = viewportHeight;
    width = height * aspectRatio;
  } else {
    width = viewportWidth;
    height = width / aspectRatio;
  }
  
  width = Math.floor(width);
  height = Math.floor(height);
  
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  
  if (container) {
    container.style.width = width + 'px';
    container.style.height = height + 'px';
  }
}

window.onload = () => {
  resizeCanvas();
  new Game();
};

window.addEventListener('resize', resizeCanvas);

window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 50);
  setTimeout(resizeCanvas, 150);
  setTimeout(resizeCanvas, 300);
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeCanvas);
}
</script>
