// SISTEMA DE HIGH SCORES
// ═══════════════════════════════════════════════════════════════════════════
const HighScores = {
    key: 'nutriaParanaScores',

    load() {
        try {
            const data = localStorage.getItem(this.key);
            return data ? JSON.parse(data) : this.getDefault();
        } catch(e) { return this.getDefault(); }
    },

    save(scores) {
        try { localStorage.setItem(this.key, JSON.stringify(scores)); } catch(e) {}
    },

    getDefault() {
        return [
            { name: 'ACE', score: 50000 },
            { name: 'PRO', score: 40000 },
            { name: 'TOP', score: 30000 },
            { name: 'MID', score: 20000 },
            { name: 'NEW', score: 10000 }
        ];
    },

    add(name, score) {
        const scores = this.load();
        scores.push({ name, score });
        scores.sort((a, b) => b.score - a.score);
        scores.length = Math.min(scores.length, 10);
        this.save(scores);
        return scores;
    },

    isHighScore(score) {
        const scores = this.load();
        return scores.length < 10 || score > scores[scores.length - 1].score;
    }
};

// ═══════════════════════════════════════════════════════════════════════════
// JUEGO PRINCIPAL
// ═══════════════════════════════════════════════════════════════════════════
class Game {
    constructor() {
        this.state = GameState.MENU;
        this.underwaterDecor = new UnderwaterDecoration();
        this.reset();

        this.hsCharIndex = [0, 0, 0];
        this.hsPos = 0;
        this.hsTimer = 0;
        this.lastInputTime = 0;

        this.menuParticles = [];
        for (let i = 0; i < 30; i++) {
            this.menuParticles.push({
                x: Math.random() * WIDTH,
                y: Math.random() * HEIGHT,
                speed: 0.5 + Math.random() * 1.5,
                size: 2 + Math.random() * 4
            });
        }

        this.stateTimer = 0;
        this.comboTimer = 0;
        this.comboCount = 0;
    }

    reset() {
        this.player = new Player(100, HEIGHT - 100);
        this.projectiles = [];
        this.enemies = [];
        this.powerUps = [];
        this.platforms = [];
        this.boss = null;
        this.currentLevel = 0;
        this.currentStage = 0;
        this.score = 0;
        this.stageCleared = false;
        this.stageClearTimer = 0;
        particles.length = 0;
    }

    loadStage() {
        const level = LEVELS[this.currentLevel];
        const stage = level.stages[this.currentStage];

        this.enemies = [];
        this.projectiles = [];
        this.powerUps = [];
        this.platforms = [];
        this.boss = null;
        this.stageCleared = false;

        for (const p of stage.platforms) {
            this.platforms.push(new Platform(p.x, p.y, p.w, p.h));
        }

        for (const e of stage.enemies) {
            this.enemies.push(new Enemy(e.x, e.y, e.type));
        }

        // Usar posición inicial definida en el nivel
        const start = stage.playerStart || { x: 100, y: HEIGHT - 100 };
        this.player.x = start.x;
        this.player.y = start.y;
        this.player.vx = 0;
        this.player.vy = 0;
    }

    loadBoss() {
        const level = LEVELS[this.currentLevel];

        this.enemies = [];
        this.projectiles = [];
        this.powerUps = [];
        this.platforms = [];
        this.stageCleared = false;

        this.platforms.push(new Platform(50, 380, 200, 20));
        this.platforms.push(new Platform(390, 380, 200, 20));
        this.platforms.push(new Platform(200, 280, 240, 20));
        this.platforms.push(new Platform(100, 180, 150, 20));
        this.platforms.push(new Platform(390, 180, 150, 20));

        this.boss = new Boss(level.boss.x, level.boss.y, level.boss.type, this.currentLevel + 1);

        // Posición segura para el jugador
        this.player.x = 100;
        this.player.y = 340;
        this.player.vx = 0;
        this.player.vy = 0;
        this.state = GameState.BOSS;
    }

    goToBoss(levelIndex) {
        this.reset();
        this.currentLevel = levelIndex;
        this.currentStage = 0;
        this.score = levelIndex * 5000;
        this.loadBoss();
        audio.menuSelect();
        audio.stopMenuMusic();
        audio.startAmbient();
    }

    nextStage() {
        this.currentStage++;
        if (this.currentStage >= LEVELS[this.currentLevel].stages.length) {
            this.loadBoss();
        } else {
            this.loadStage();
            this.state = GameState.PLAYING;
        }
    }

    nextLevel() {
        this.currentLevel++;
        this.currentStage = 0;

        if (this.currentLevel >= LEVELS.length) {
            this.state = GameState.VICTORY;
            this.stateTimer = 0;
            audio.stopAmbient();
            audio.levelComplete();
        } else {
            this.loadStage();
            this.state = GameState.PLAYING;
        }
    }

    update() {
        Input.update();
        this.stateTimer++;
        this.underwaterDecor.update();

        switch(this.state) {
            case GameState.MENU: this.updateMenu(); break;
            case GameState.PLAYING: this.updatePlaying(); break;
            case GameState.BOSS: this.updateBoss(); break;
            case GameState.LEVEL_COMPLETE:
                if (this.stateTimer > 180 || Input.isConfirmJustPressed()) {
                    this.nextLevel();
                }
                break;
            case GameState.GAME_OVER:
                if (this.stateTimer > 120 && Input.isConfirmJustPressed()) {
                    if (HighScores.isHighScore(this.score)) {
                        this.state = GameState.HIGH_SCORE_ENTRY;
                        this.hsPos = 0;
                        this.hsCharIndex = [0, 0, 0];
                        this.stateTimer = 0;
                    } else {
                        this.state = GameState.HIGH_SCORES;
                        this.stateTimer = 0;
                    }
                }
                break;
            case GameState.VICTORY:
                if (this.stateTimer > 180 && Input.isConfirmJustPressed()) {
                    if (HighScores.isHighScore(this.score)) {
                        this.state = GameState.HIGH_SCORE_ENTRY;
                        this.hsPos = 0;
                        this.hsCharIndex = [0, 0, 0];
                        this.stateTimer = 0;
                    } else {
                        this.state = GameState.HIGH_SCORES;
                        this.stateTimer = 0;
                    }
                }
                break;
            case GameState.HIGH_SCORE_ENTRY: this.updateHighScoreEntry(); break;
            case GameState.HIGH_SCORES:
                if (this.stateTimer > 60 && Input.isConfirmJustPressed()) {
                    this.reset();
                    this.state = GameState.MENU;
                    audio.startMenuMusic();
                }
                break;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
    }

    updateMenu() {
        // Iniciar música del menú si no está sonando
        if (!audio.menuMusicPlaying) {
            audio.startMenuMusic();
        }

        for (const p of this.menuParticles) {
            p.y -= p.speed;
            if (p.y < -10) {
                p.y = HEIGHT + 10;
                p.x = Math.random() * WIDTH;
            }
        }

        if (Input.isConfirmJustPressed()) {
            audio.menuSelect();
            audio.stopMenuMusic();
            audio.startAmbient();
            this.reset();
            this.loadStage();
            this.state = GameState.PLAYING;
        }

        // Atajos a jefes: teclas 4, 5, 6
        if (Input.isKeyJustPressed('Digit4') || Input.isKeyJustPressed('Numpad4')) {
            this.goToBoss(0);
        }
        if (Input.isKeyJustPressed('Digit5') || Input.isKeyJustPressed('Numpad5')) {
            this.goToBoss(1);
        }
        if (Input.isKeyJustPressed('Digit6') || Input.isKeyJustPressed('Numpad6')) {
            this.goToBoss(2);
        }
    }

    updatePlaying() {
        this.player.update(this.platforms);

        if (Input.attack) {
            this.player.attack(this.projectiles);
        }
        this.player.resetAttack();

        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            proj.update();

            if (!proj.active) {
                this.projectiles.splice(i, 1);
                continue;
            }

            for (const enemy of this.enemies) {
                if (enemy.trapped <= 0 && this.checkCollision(proj, enemy)) {
                    enemy.trap();
                    this.projectiles.splice(i, 1);
                    break;
                }
            }
        }

        for (let i = this.enemies.length - 1; i >= 0; i--) {
            const enemy = this.enemies[i];
            enemy.update(this.platforms, this.player);

            if (this.checkCollision(this.player, enemy)) {
                if (enemy.trapped > 0) {
                    const pushDir = this.player.centerX < enemy.centerX ? 1 : -1;
                    enemy.push(pushDir);
                    this.killEnemy(enemy, i);
                } else {
                    if (this.player.takeDamage()) {
                        this.state = GameState.GAME_OVER;
                        this.stateTimer = 0;
                        audio.stopAmbient();
                        audio.gameOver();
                    }
                }
            }

            if (enemy.trapped === 1) {
                spawnParticles(enemy.centerX, enemy.centerY, '#ff6b6b', 10);
            }

            if (enemy.y > HEIGHT || enemy.x < -50 || enemy.x > WIDTH + 50) {
                this.killEnemy(enemy, i);
            }
        }

        for (let i = this.powerUps.length - 1; i >= 0; i--) {
            const pu = this.powerUps[i];
            pu.update();

            if (!pu.active) {
                this.powerUps.splice(i, 1);
                continue;
            }

            if (this.checkCollision(this.player, pu)) {
                const bonusPoints = pu.apply(this.player);
                this.powerUps.splice(i, 1);
                this.score += 500 + bonusPoints;
            }
        }

        if (this.enemies.length === 0 && !this.stageCleared) {
            this.stageCleared = true;
            this.stageClearTimer = 90;
            audio.levelComplete();
            this.score += 1000;
        }

        if (this.stageCleared) {
            this.stageClearTimer--;
            if (this.stageClearTimer <= 0) this.nextStage();
        }

        if (this.comboTimer > 0) {
            this.comboTimer--;
            if (this.comboTimer === 0) this.comboCount = 0;
        }
    }

    updateBoss() {
        this.player.update(this.platforms);

        if (Input.attack) {
            this.player.attack(this.projectiles);
        }
        this.player.resetAttack();

        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            proj.update();

            if (!proj.active) {
                this.projectiles.splice(i, 1);
                continue;
            }

            if (this.boss && this.checkCollision(proj, this.boss)) {
                if (this.boss.takeDamage()) {
                    this.score += this.boss.points;
                    spawnParticles(this.boss.centerX, this.boss.centerY, this.boss.color, 50);
                    audio.levelComplete();
                    this.state = GameState.LEVEL_COMPLETE;
                    this.stateTimer = 0;
                }
                this.projectiles.splice(i, 1);
            }
        }

        if (this.boss && !this.boss.defeated) {
            this.boss.update(this.player, this.projectiles, this.platforms);

            if (this.checkCollision(this.player, this.boss)) {
                if (this.player.takeDamage()) {
                    this.state = GameState.GAME_OVER;
                    this.stateTimer = 0;
                    audio.stopAmbient();
                    audio.gameOver();
                }
            }

            // Colisión con proyectiles del jefe
            if (this.boss.type === 'basura') {
                const hitProj = this.boss.checkProjectileCollision(this.player);
                if (hitProj) {
                    if (this.player.takeDamage()) {
                        this.state = GameState.GAME_OVER;
                        this.stateTimer = 0;
                        audio.stopAmbient();
                        audio.gameOver();
                    } else {
                        spawnParticles(hitProj.x, hitProj.y, '#7f8c8d', 8);
                        const idx = this.boss.projectiles.indexOf(hitProj);
                        if (idx > -1) this.boss.projectiles.splice(idx, 1);
                    }
                }
            }
        }
    }

    updateHighScoreEntry() {
        this.hsTimer++;
        const now = Date.now();
        const canInput = now - this.lastInputTime > 150;

        if (canInput) {
            if (Input.menuUp) {
                this.hsCharIndex[this.hsPos] = (this.hsCharIndex[this.hsPos] + 1) % HS_CHARS.length;
                this.lastInputTime = now;
                audio.menuSelect();
            }
            if (Input.menuDown) {
                this.hsCharIndex[this.hsPos] = (this.hsCharIndex[this.hsPos] - 1 + HS_CHARS.length) % HS_CHARS.length;
                this.lastInputTime = now;
                audio.menuSelect();
            }
            if (Input.menuRight) {
                this.hsPos = (this.hsPos + 1) % 3;
                this.lastInputTime = now;
                audio.menuSelect();
            }
            if (Input.menuLeft) {
                this.hsPos = (this.hsPos + 2) % 3;
                this.lastInputTime = now;
                audio.menuSelect();
            }
        }

        if (Input.isConfirmJustPressed()) {
            const name = this.hsCharIndex.map(i => HS_CHARS[i]).join('');
            HighScores.add(name, this.score);
            this.state = GameState.HIGH_SCORES;
            this.stateTimer = 0;
            audio.powerUp();
        }
    }

    killEnemy(enemy, index) {
        this.comboCount++;
        this.comboTimer = 60;

        const comboMultiplier = Math.min(this.comboCount, 8);
        const points = enemy.points * comboMultiplier;
        this.score += points;

        audio.enemyKill();
        spawnParticles(enemy.centerX, enemy.centerY, enemy.color, 15);

        // Sistema de power-ups mejorado estilo Snow Bros
        if (Math.random() < 0.35) {
            const rand = Math.random();
            let type;
            if (rand < 0.15) type = 'speed';
            else if (rand < 0.25) type = 'double';
            else if (rand < 0.35) type = 'jump';
            else if (rand < 0.42) type = 'life';
            else if (rand < 0.52) type = 'power';
            else if (rand < 0.70) type = 'points100';
            else if (rand < 0.82) type = 'points500';
            else if (rand < 0.92) type = 'points1000';
            else type = 'points2000';

            this.powerUps.push(new PowerUp(enemy.centerX - 12, enemy.centerY, type));
        }

        this.enemies.splice(index, 1);
    }

    checkCollision(a, b) {
        return a.x < b.x + b.width &&
               a.x + a.width > b.x &&
               a.y < b.y + b.height &&
               a.y + a.height > b.y;
    }

    draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        switch(this.state) {
            case GameState.MENU: this.drawMenu(); break;
            case GameState.PLAYING:
            case GameState.BOSS:
                this.drawGame();
                break;
            case GameState.LEVEL_COMPLETE:
                this.drawGame();
                this.drawLevelComplete();
                break;
            case GameState.GAME_OVER:
                this.drawGame();
                this.drawGameOver();
                break;
            case GameState.VICTORY: this.drawVictory(); break;
            case GameState.HIGH_SCORE_ENTRY: this.drawHighScoreEntry(); break;
            case GameState.HIGH_SCORES: this.drawHighScores(); break;
        }
    }

    drawMenuNutria(x, y) {

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(x + 40, y + 85, 30, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        const tailWave = Math.sin(swimAnim) * 5;
        ctx.fillStyle = '#5D4037';
        ctx.beginPath();
        ctx.ellipse(x + 5 + tailWave, y + 45 + bounce, 15, 7, -0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#6D4C41';
        ctx.beginPath();
        ctx.ellipse(x + 40, y + 40 + bounce, 24, 30, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#A1887F';
        ctx.beginPath();
        ctx.ellipse(x + 40, y + 45 + bounce, 15, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#6D4C41';
        ctx.beginPath();
        ctx.ellipse(x + 45, y + 8 + bounce, 16, 13, 0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#8D6E63';
        ctx.beginPath();
        ctx.ellipse(x + 58, y + 10 + bounce, 10, 8, 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.ellipse(x + 65, y + 8 + bounce, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(x + 38, y + 4 + bounce, 6, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 50, y + 6 + bounce, 6, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.ellipse(x + 40, y + 4 + bounce, 3, 4, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 52, y + 6 + bounce, 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(100, 200, 255, 0.6)';
        const bubbleX = x + 80 + Math.sin(Date.now() / 300) * 10;

        ctx.beginPath();
        ctx.arc(bubbleX, bubbleY + bounce, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bubbleX + 15, bubbleY - 12 + bounce, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    drawGame() {
        const level = LEVELS[this.currentLevel];

        // Fondo acuático
        const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        gradient.addColorStop(0, level.bgColor1);
        gradient.addColorStop(1, level.bgColor2);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Decoración submarina
        this.underwaterDecor.draw(ctx, level.theme);

        // Suelo del río
        ctx.fillStyle = '#1a3a2a';
        ctx.fillRect(0, HEIGHT - 32, WIDTH, 32);
        ctx.fillStyle = '#2a4a3a';
        for (let i = 0; i < WIDTH; i += 40) {
            ctx.beginPath();
            ctx.ellipse(i + 20, HEIGHT - 32, 15, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        for (const platform of this.platforms) platform.draw(ctx, level.theme);
        for (const pu of this.powerUps) pu.draw(ctx);
        for (const proj of this.projectiles) proj.draw(ctx);
        for (const enemy of this.enemies) enemy.draw(ctx);
        if (this.boss) this.boss.draw(ctx);
        this.player.draw(ctx);
        for (const p of particles) p.draw(ctx);

        // Efecto de agua en primer plano
        this.underwaterDecor.drawForeground(ctx);

        this.drawHUD();

        if (this.stageCleared && this.state === GameState.PLAYING) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, HEIGHT/2 - 40, WIDTH, 80);

            ctx.textAlign = 'center';
            ctx.font = 'bold 32px Courier New';
            ctx.fillStyle = '#2ecc71';
            ctx.fillText('¡PANTALLA COMPLETADA!', WIDTH/2, HEIGHT/2 + 10);
        }

        if (this.comboCount > 1) {
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px Courier New';
            ctx.fillStyle = '#f1c40f';
            ctx.fillText(`${this.comboCount}x COMBO!`, WIDTH/2, 80);
        }
    }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, WIDTH, 35);

        ctx.textAlign = 'left';
        ctx.font = 'bold 14px Courier New';
        ctx.fillStyle = '#3498db';
        ctx.fillText(`${level.name}`, 10, 22);

        if (this.state !== GameState.BOSS) {
            ctx.fillStyle = '#bdc3c7';
            ctx.fillText(`${this.currentStage + 1}/3`, 200, 22);
        } else {
            ctx.fillStyle = '#e74c3c';
            ctx.fillText('¡JEFE!', 200, 22);
        }

        ctx.fillStyle = '#f1c40f';
        ctx.textAlign = 'center';
        ctx.fillText(`SCORE: ${this.score.toString().padStart(8, '0')}`, WIDTH/2, 22);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#e74c3c';
        for (let i = 0; i < this.player.lives; i++) {

            ctx.fillText(scores[i].name, WIDTH/2 - 80, y);
            ctx.textAlign = 'right';
            ctx.fillText(scores[i].score.toString().padStart(8, '0'), WIDTH/2 + 130, y);
        }

        if (this.stateTimer > 60) {
            ctx.textAlign = 'center';
            ctx.font = '16px Courier New';
            ctx.fillStyle = '#7f8c8d';
            const blink = Math.floor(Date.now() / 500) % 2;
            if (blink) {
                ctx.fillText('Presioná ENTER o BOTÓN 3 para volver', WIDTH/2, HEIGHT - 40);
            }
        }
    }
}
