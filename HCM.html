<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HackTribe">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>HackTribe Controller</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a25;--border:#2a2a3a;
  --accent:#00ff88;--accent2:#ff0088;--accent3:#0088ff;--text:#e0e0e0;
  --text-dim:#666;--note:#00ff88;--note-dim:#004422;--grid:#1a1a2a;
  --playhead:#ff0088;--scale-highlight:rgba(0,255,136,0.05);
}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',monospace;font-size:12px;overflow-x:hidden}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;gap:1px;background:var(--border)}

/* Header */
.header{background:var(--surface);padding:8px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:14px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.header h1 span{color:var(--accent2)}
.midi-status{display:flex;align-items:center;gap:6px;margin-left:auto}
.midi-dot{width:8px;height:8px;border-radius:50%;background:#ff3333;transition:background .3s}
.midi-dot.connected{background:var(--accent);box-shadow:0 0 8px var(--accent)}
select,button{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:3px;font-family:inherit;font-size:11px;cursor:pointer}
select:hover,button:hover{border-color:var(--accent)}
button:active{background:var(--accent);color:#000}
button.active{background:var(--accent);color:#000}
#btnRefreshMidi{font-size:14px;padding:2px 6px;line-height:1}
#btnRefreshMidi:hover{background:var(--accent);color:#000;transform:rotate(180deg);transition:transform .3s}
#btnTestMidi{font-size:12px;padding:2px 6px;line-height:1}
#btnTestMidi:hover{background:var(--accent2);color:#000}

/* Main */
.main{display:grid;grid-template-columns:200px 1fr 320px;background:var(--surface);overflow:hidden}

/* Sidebar - Parts */
.sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:4px}
.sidebar h3{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;padding:6px 8px;border-bottom:1px solid var(--border)}
.part-list{list-style:none}
.part-item{padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);transition:background .15s}
.part-item:hover{background:var(--surface2)}
.part-item.selected{background:rgba(0,255,136,0.15);border-left:3px solid var(--accent)}
.part-item.selected .part-num{color:#fff}
.part-item.selected .part-name{color:var(--accent);font-weight:bold}
.part-num{color:var(--accent);font-weight:bold;min-width:20px}
.part-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part-mute{width:16px;height:16px;border-radius:2px;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px}
.part-mute.muted{background:var(--accent2);border-color:var(--accent2);color:#000}

/* Piano Roll */
.pianoroll-container{position:relative;overflow:hidden;display:flex;flex-direction:column}
.pianoroll-toolbar{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.pianoroll-toolbar label{color:var(--text-dim);font-size:10px}
.pianoroll-toolbar select,.pianoroll-toolbar input[type=number]{width:auto}
.pianoroll-toolbar input[type=number]{width:50px;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:2px 4px;border-radius:3px;font-family:inherit;font-size:11px}
.pianoroll{flex:1;position:relative;overflow:auto;cursor:crosshair}
.pianoroll canvas{position:absolute;top:0;left:0}
.piano-keys{position:absolute;left:0;top:0;width:60px;height:100%;z-index:2}
.piano-keys canvas{display:block}
.grid-area{position:absolute;left:60px;top:0;right:0;bottom:0}

/* Right Panel - CC */
.right-panel{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:8px}
.right-panel h3{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:6px}
.cc-group{margin-bottom:10px}
.cc-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.cc-row label{flex:1;color:var(--accent);font-size:10px}
.cc-row input[type=range]{flex:2;height:4px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none}
.cc-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
.cc-row .cc-val{width:28px;text-align:right;color:var(--accent);font-size:10px}
.cc-row .cc-num{color:var(--text-dim);font-size:9px;width:24px}

/* Panel Tabs */
.panel-tabs{display:flex;gap:2px;margin-bottom:8px}
.panel-tabs .tab{flex:1;padding:4px 8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);cursor:pointer;border-radius:3px 3px 0 0}
.panel-tabs .tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
.panel-tabs .tab:hover:not(.active){border-color:var(--accent);color:var(--text)}
.tab-content{display:block}
.tab-content[style*="display:none"]{display:none!important}

/* LFO Panel */
.lfo-card{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px;margin-bottom:6px}
.lfo-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.lfo-num{color:var(--accent);font-weight:bold;font-size:10px;min-width:32px}
.lfo-toggle{padding:2px 8px;font-size:9px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer}
.lfo-toggle.active{background:var(--accent);color:#000;border-color:var(--accent)}
.lfo-rate-type{padding:2px 6px;font-size:9px;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer;flex-shrink:0}
.lfo-rate-type.active{background:var(--accent3);color:#000;border-color:var(--accent3)}
.lfo-rate-hz{flex:1 1 50px;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;min-width:0}
.lfo-rate-hz::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent3);cursor:pointer}
.lfo-rate-hz-val{color:var(--accent3);font-size:9px;text-align:right;flex-shrink:0}
.lfo-waveform{width:auto;font-size:10px}
.lfo-mfx-btn{padding:2px 5px;font-size:9px;font-weight:bold;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer}
.lfo-mfx-btn.active{background:var(--accent2);color:#000;border-color:var(--accent2)}
.lfo-inv-btn{padding:2px 5px;font-size:9px;font-weight:bold;border-radius:3px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);cursor:pointer}
.lfo-inv-btn.active{background:var(--accent3);color:#000;border-color:var(--accent3)}
.lfo-display{width:100%;height:40px;border-radius:3px;border:1px solid var(--border);display:block}
.lfo-controls{margin-top:4px}
.lfo-row{display:flex;align-items:center;gap:4px;padding:2px 0;font-size:10px;flex-wrap:wrap}
.lfo-row label{color:var(--text-dim);font-size:9px;flex-shrink:0}
.lfo-row select{width:auto;font-size:10px;flex-shrink:0}
.lfo-row input[type=range]{flex:1 1 60px;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;min-width:0}
.lfo-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer}
.lfo-row span{color:var(--accent);font-size:9px;text-align:right;flex-shrink:0}

/* Transport Bar */
.transport{background:var(--surface);padding:6px 16px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);flex-wrap:wrap}
.transport-group{display:flex;align-items:center;gap:4px}
.transport-group label{color:var(--accent);font-size:10px}
.transport-group select{font-size:13px;padding:3px 6px}
.transport-btn{width:32px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px}
.transport-btn.playing{background:var(--accent);color:#000}
.bpm-display{background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:3px;color:var(--accent);font-size:14px;font-weight:bold;min-width:60px;text-align:center}
.note-info{margin-left:auto;color:var(--text-dim);font-size:10px}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* Context menu */
.context-menu{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:4px 0;z-index:100;display:none;min-width:120px}
.context-menu-item{padding:6px 12px;cursor:pointer;font-size:11px}
.context-menu-item:hover{background:var(--accent);color:#000}

/* Preset Panel */
.preset-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:150;display:none;flex-direction:column;overflow:hidden}
.preset-panel.open{display:flex}
.preset-panel-header{background:var(--surface);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.preset-action-btn{background:var(--surface2);color:var(--accent);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:9px;font-weight:bold;cursor:pointer;min-height:24px;white-space:nowrap}
.preset-action-btn:active{background:var(--accent);color:#000}
.preset-close-btn{background:none;color:var(--text-dim);border:none;font-size:16px;cursor:pointer;padding:2px 6px;min-height:24px}
.preset-autosave{background:var(--surface2);padding:6px 12px;font-size:10px;color:var(--text-dim);border-bottom:1px solid var(--border);flex-shrink:0}
.preset-list{flex:1;overflow-y:auto;padding:4px}
.preset-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.preset-item-name{flex:1;font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-item-date{font-size:8px;color:var(--text-dim);white-space:nowrap}
.preset-item-btn{background:var(--surface2);color:var(--accent);border:1px solid var(--border);border-radius:3px;padding:3px 6px;font-size:9px;cursor:pointer;min-height:22px;white-space:nowrap}
.preset-item-btn:active{background:var(--accent);color:#000}
.preset-item-btn.delete{color:var(--accent2)}
.preset-item-btn.delete:active{background:var(--accent2);color:#fff}
.preset-empty{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:11px}

/* ==================== MOBILE — TCL 50 5G Landscape (806×360) ==================== */
@media (max-height:400px) and (orientation:landscape) {
  body{font-size:11px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
  .app{grid-template-rows:28px 1fr 30px;grid-template-columns:1fr;height:100vh;height:100dvh;gap:0}

  /* Header - single compact row */
  .header{padding:2px 6px;gap:6px;min-height:28px;max-height:28px}
  .header h1{font-size:10px;letter-spacing:1px}
  .midi-status{gap:3px;margin-left:auto;align-items:center}
  .midi-status label{font-size:9px}
  .midi-status select{font-size:10px;padding:2px 4px;min-height:22px;max-width:110px}
  #btnRefreshMidi,#btnTestMidi{font-size:11px;padding:1px 4px;min-height:22px;min-width:22px}
  #midiDebug{display:none}

  /* Main - 3 columns: parts | piano | cc/lfo */
  .main{grid-template-columns:48px 1fr 150px;grid-template-rows:1fr;overflow:hidden;gap:0}

  /* Sidebar - narrow vertical strip */
  .sidebar{border-right:1px solid var(--border);border-bottom:none;overflow-y:auto;overflow-x:hidden;padding:2px}
  .sidebar h3{display:none}
  .part-list{display:flex;flex-direction:column;gap:1px}
  .part-item{padding:2px 1px;border-bottom:none;border-radius:3px;min-width:0;justify-content:center;gap:1px}
  .part-item.selected{border-left:none;border-bottom:none;background:rgba(0,255,136,0.25);outline:2px solid var(--accent)}
  .part-num{font-size:9px;min-width:14px;text-align:center}
  .part-name{display:none}
  .part-mute{width:14px;height:14px;font-size:7px;border-width:1px}
  .midi-dot{display:none}

  /* Piano Roll Toolbar - single compact row */
  .pianoroll-container{min-height:0;min-width:0}
  .pianoroll-toolbar{padding:1px 4px;gap:3px;overflow-x:auto;flex-wrap:nowrap;min-height:22px;align-items:center;-webkit-overflow-scrolling:touch}
  .pianoroll-toolbar label{font-size:8px;color:var(--text-dim)}
  .pianoroll-toolbar select{font-size:9px;padding:1px 3px;min-height:18px;min-width:0}
  .pianoroll-toolbar input[type=number]{font-size:9px;padding:1px 3px;width:32px;min-height:18px}
  .pianoroll-toolbar input[type=checkbox]{width:12px;height:12px}
  .pianoroll-toolbar button{font-size:8px;padding:2px 4px;min-height:18px;min-width:24px;white-space:nowrap}
  .piano-keys{width:28px}
  .grid-area{left:28px}

  /* Right Panel - CC/LFO */
  .right-panel{border-left:1px solid var(--border);border-top:none;padding:2px;overflow-y:auto;overflow-x:hidden}
  .panel-tabs{position:sticky;top:0;z-index:5;background:var(--surface);margin:0 -2px;padding:2px;gap:1px}
  .panel-tabs .tab{padding:3px 4px;font-size:9px;min-height:20px;letter-spacing:0}
  .panel-tabs .panel-close-btn{padding:2px 6px;font-size:10px;min-height:20px}
  .right-panel h3{font-size:8px;padding:2px 0;margin-bottom:3px}
  .cc-row{padding:2px 0;gap:3px}
  .cc-row label{font-size:8px;flex:1}
  .cc-row input[type=range]{flex:2;height:3px}
  .cc-row input[type=range]::-webkit-slider-thumb{width:10px;height:10px}
  .cc-row .cc-val{font-size:8px;width:22px}
  .cc-row .cc-num{font-size:7px;width:18px}
  .lfo-card{padding:3px;margin-bottom:3px;border-radius:3px}
  .lfo-header{gap:3px;margin-bottom:2px}
  .lfo-num{font-size:8px;min-width:20px}
  .lfo-toggle,.lfo-rate-type,.lfo-inv-btn,.lfo-mfx-btn{padding:2px 4px;font-size:8px;min-height:18px;min-width:24px}
  .lfo-display{height:24px}
  .lfo-row{gap:2px;padding:1px 0;font-size:8px}
  .lfo-row label{font-size:7px}
  .lfo-row select{font-size:8px;padding:1px 2px;min-height:16px}
  .lfo-row input[type=range]{height:3px}
  .lfo-row input[type=range]::-webkit-slider-thumb{width:8px;height:8px}
  .lfo-row span{font-size:7px}

  /* Transport - compact bottom bar */
  .transport{padding:2px 8px;gap:6px;min-height:30px;align-items:center;flex-wrap:nowrap;overflow-x:auto}
  .transport-btn{width:30px;height:24px;font-size:12px;border-radius:3px;min-height:24px}
  .transport-btn.playing{background:var(--accent);color:#000}
  .bpm-display{font-size:11px;padding:1px 6px;min-width:36px;min-height:20px}
  .transport-group label{font-size:8px}
  .transport-group select{font-size:9px;padding:2px 3px;min-height:20px}
  .transport input[type=range]{height:3px;width:50px}
  .transport input[type=range]::-webkit-slider-thumb{width:10px;height:10px}
  .note-info{font-size:8px;margin-left:auto;white-space:nowrap}
  #presetGroup{gap:2px}
  #presetGroup .transport-btn{width:26px;font-size:10px}
  #presetSelect{font-size:8px;padding:1px 3px;min-height:18px;max-width:80px}

  /* Global touch targets */
  select{min-height:20px;font-size:10px}
  button{min-height:20px;font-size:10px}
  input[type=range]{height:3px}
  input[type=range]::-webkit-slider-thumb{width:12px;height:12px}

  /* Context menu - compact popup */
  .context-menu{border-radius:6px;padding:2px 0;min-width:100px}
  .context-menu-item{padding:6px 10px;font-size:10px}
}

/* ==================== MOBILE — Portrait (≤768px) ==================== */
@media (max-width:768px) and (orientation:portrait) {
  body{font-size:14px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .app{grid-template-rows:auto auto 1fr auto;grid-template-columns:1fr;height:100vh;height:100dvh}

  /* Header - stacked */
  .header{padding:6px 10px;gap:8px}
  .header h1{font-size:12px}
  .midi-status{flex-wrap:wrap;gap:4px;margin-left:0;width:100%}
  .midi-status select{font-size:12px;padding:6px 8px;min-width:0;flex:1 1 45%}
  #midiDebug{display:none}

  /* Main - vertical stack */
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;overflow:hidden}

  /* Sidebar - horizontal scroll */
  .sidebar{border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;padding:4px}
  .sidebar h3{display:none}
  .part-list{display:flex;gap:2px;white-space:nowrap}
  .part-item{padding:8px 10px;border-bottom:none;border-radius:4px;min-width:60px;text-align:center;flex-shrink:0}
  .part-item.selected{border-left:none;border-bottom:3px solid var(--accent)}
  .part-name{font-size:10px}
  .part-mute{width:22px;height:22px;font-size:11px}

  /* Piano Roll */
  .pianoroll-container{min-height:0}
  .pianoroll-toolbar{padding:4px 6px;gap:4px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .pianoroll-toolbar label{font-size:9px}
  .pianoroll-toolbar select,.pianoroll-toolbar input[type=number]{font-size:12px;padding:6px 4px}
  .pianoroll-toolbar button{font-size:11px;padding:6px 8px;min-height:32px;white-space:nowrap}
  .piano-keys{width:40px}
  .grid-area{left:40px}

  /* Right Panel */
  .right-panel{border-left:none;border-top:1px solid var(--border);max-height:45vh;overflow-y:auto;padding:6px}
  .panel-tabs{position:sticky;top:0;z-index:5;background:var(--surface);margin:0 -6px;padding:4px 6px}
  .panel-tabs .tab{padding:10px 8px;font-size:12px;min-height:40px}
  .cc-row{padding:6px 0}
  .cc-row label{font-size:11px}
  .cc-row input[type=range]{height:6px}
  .cc-row input[type=range]::-webkit-slider-thumb{width:18px;height:18px}
  .cc-row .cc-val{font-size:12px;width:32px}
  .lfo-card{padding:8px;margin-bottom:8px}
  .lfo-toggle,.lfo-rate-type,.lfo-inv-btn,.lfo-mfx-btn{padding:6px 10px;font-size:11px;min-height:32px}

  /* Transport */
  .transport{padding:8px 10px;gap:8px;flex-wrap:wrap}
  .transport-btn{width:44px;height:40px;font-size:18px;border-radius:6px}
  .bpm-display{font-size:16px;padding:4px 10px;min-width:50px}
  .transport-group label{font-size:11px}
  .transport-group select{font-size:13px;padding:6px 8px}
  .transport input[type=range]{height:6px}
  .note-info{font-size:10px;margin-left:0;width:100%;text-align:center}
  #presetGroup{gap:4px}
  #presetGroup .transport-btn{width:36px;font-size:14px}
  #presetSelect{font-size:11px;padding:4px 6px;min-height:28px;max-width:120px}

  select{min-height:36px;font-size:13px}
  button{min-height:36px}

  .context-menu{position:fixed;bottom:0;left:0;right:0;border-radius:12px 12px 0 0;padding:8px 0;z-index:200;min-width:auto}
  .context-menu-item{padding:14px 20px;font-size:14px}
}

/* Mobile panel toggle button */
.mobile-panel-toggle{display:none;position:fixed;bottom:40px;right:8px;width:40px;height:40px;border-radius:50%;background:var(--accent2);color:#000;border:none;font-size:16px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.5);cursor:pointer}
@media(max-width:768px) and (orientation:portrait){.mobile-panel-toggle{display:flex;align-items:center;justify-content:center}}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>HACK<span>TRIBE</span> CONTROLLER</h1>
    <div class="midi-status">
      <label>MIDI:</label>
      <select id="midiOut"><option value="">-- No Output --</option></select>
      <select id="midiIn"><option value="">-- No Input --</option></select>
      <button id="btnRefreshMidi" title="Refresh MIDI devices">↻</button>

// ==================== MIDI ====================
let midiAccess = null;

async function initMIDI() {
  const debugEl = document.getElementById('midiDebug');
  if (!navigator.requestMIDIAccess) {
    debugEl.textContent = 'Web MIDI not supported';
    alert('Web MIDI API not supported in this browser.\nUse Chrome, Edge, or Opera.');
    return;
  }
  // Check if running from file:// protocol (Web MIDI requires HTTPS or localhost)
  if (location.protocol === 'file:') {
    debugEl.textContent = 'Web MIDI needs HTTP server';
    alert('Web MIDI no funciona con archivos locales (file://).\n\n' +
      'Solucion rapida en Android:\n' +
      '1. Instalar Termux desde F-Droid\n' +
      '2. Ejecutar: pkg install python\n' +
      '3. Ejecutar: python hacktribe-serve.py\n' +
      '4. Abrir en Chrome: http://localhost:8080\n\n' +
      'Sin PC: Ejecutar serve.bat en la PC\n' +
      'y abrir http://IP:8080 en el telefono');
    return;
  }
  if (midiAccess) {
    enumerateDevices(midiAccess);
    return;
  }
  try {
    debugEl.textContent = 'Requesting MIDI access...';
    midiAccess = await navigator.requestMIDIAccess({sysex: false});
    debugEl.textContent = 'MIDI OK - scanning...';
    enumerateDevices(midiAccess);
    setupMIDIStateChange();
  } catch(e) {
    console.error('MIDI access error (non-SysEx):', e);
    try {
      debugEl.textContent = 'Trying SysEx...';
      midiAccess = await navigator.requestMIDIAccess({sysex: true});
      debugEl.textContent = 'MIDI OK (SysEx) - scanning...';
      enumerateDevices(midiAccess);
      setupMIDIStateChange();
    } catch(e2) {
      debugEl.textContent = 'MIDI failed: ' + e2.message;
      console.error('MIDI SysEx error:', e2);
      if (navigator.userAgent.includes('Android')) {
        debugEl.textContent = 'MIDI failed. Check chrome://flags';
      }
    }
  }
}

function setupMIDIStateChange() {
  midiAccess.onstatechange = () => {
    // Lighter debounce: reconnect after 500ms of quiet
    clearTimeout(midiAccess._stateTimer);
    midiAccess._stateTimer = setTimeout(() => {
      console.log('MIDI state changed, rescanning...');
      enumerateDevices(midiAccess);
    }, 500);
  };
}

// Also allow manual MIDI init by clicking the status dot
document.addEventListener('DOMContentLoaded', () => {
  const dot = document.getElementById('midiDot');
  dot.style.cursor = 'pointer';
  dot.title = 'Tap to initialize/refresh MIDI';
  dot.onclick = () => {

    else enumerateDevices(midiAccess);
  };
  // Android: also handle touch on the dot
  dot.ontouchend = (e) => {
    e.preventDefault();
    if (!midiAccess) initMIDI();
    else enumerateDevices(midiAccess);
  };
});

function enumerateDevices(access) {
  const outSel = document.getElementById('midiOut');
  const inSel = document.getElementById('midiIn');
  const dot = document.getElementById('midiDot');
  const debugEl = document.getElementById('midiDebug');

  const prevOut = outSel.value;
  const prevIn = inSel.value;

  outSel.innerHTML = '';
  inSel.innerHTML = '';

  const outDevices = [];
  const inDevices = [];
  for (const [id, output] of access.outputs) {
    outDevices.push({id, name: output.name, manufacturer: output.manufacturer, state: output.state});
  }
  for (const [id, input] of access.inputs) {
    inDevices.push({id, name: input.name, manufacturer: input.manufacturer, state: input.state});
  }

  console.log('MIDI Outputs:', outDevices);
  console.log('MIDI Inputs:', inDevices);

  if (outDevices.length === 0) {
    outSel.innerHTML = '<option value="">-- No Output --</option>';
  }
  outDevices.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.id;
    opt.textContent = `${d.name}`;
    if (d.manufacturer) opt.textContent += ` (${d.manufacturer})`;
    if (d.state === 'disconnected') opt.textContent += ' [DISCONNECTED]';
    outSel.appendChild(opt);
  });

  if (inDevices.length === 0) {
    inSel.innerHTML = '<option value="">-- No Input --</option>';
  }
  inDevices.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.id;
    opt.textContent = `${d.name}`;
    if (d.manufacturer) opt.textContent += ` (${d.manufacturer})`;
    if (d.state === 'disconnected') opt.textContent += ' [DISCONNECTED]';
    inSel.appendChild(opt);
  });

  if (prevOut && access.outputs.get(prevOut)) {
    outSel.value = prevOut;
  }
  if (prevIn && access.inputs.get(prevIn)) {
    inSel.value = prevIn;
  }

  // Auto-connect: look for KORG/Electribe first, then any connected device
  if (!outSel.value && outDevices.length > 0) {
    const korgIdx = outDevices.findIndex(d => /korg|electribe|electribe\s*2|electribe2/i.test(d.name));
    if (korgIdx >= 0) {
      outSel.value = outDevices[korgIdx].id;
      console.log('Auto-connected output:', outDevices[korgIdx].name);
    } else {
      const connectedIdx = outDevices.findIndex(d => d.state === 'connected');
      outSel.value = connectedIdx >= 0 ? outDevices[connectedIdx].id : outDevices[0].id;
    }
  }
  if (!inSel.value && inDevices.length > 0) {
    const korgIdx = inDevices.findIndex(d => /korg|electribe|electribe\s*2|electribe2/i.test(d.name));
    if (korgIdx >= 0) {
      inSel.value = inDevices[korgIdx].id;
      console.log('Auto-connected input:', inDevices[korgIdx].name);
    } else {
      const connectedIdx = inDevices.findIndex(d => d.state === 'connected');
      inSel.value = connectedIdx >= 0 ? inDevices[connectedIdx].id : inDevices[0].id;
    }
  }

  connectOutput();
  connectInput();

  const connected = !!(state.midiOut || state.midiIn);
  dot.classList.toggle('connected', connected);

  const outName = outSel.value ? access.outputs.get(outSel.value)?.name : 'none';
  const inName = inSel.value ? access.inputs.get(inSel.value)?.name : 'none';
  const outState = outSel.value ? access.outputs.get(outSel.value)?.state : '';
  const inState = inSel.value ? access.inputs.get(inSel.value)?.state : '';
  debugEl.textContent = `Out: ${outName}(${outState}) | In: ${inName}(${inState})`;
  debugEl.title = `Outputs: ${outDevices.length}, Inputs: ${inDevices.length}`;
  console.log(`MIDI devices: ${outDevices.length} out, ${inDevices.length} in`);

  outSel.onchange = connectOutput;
  inSel.onchange = connectInput;
}

function connectOutput() {
  const outSel = document.getElementById('midiOut');
  const dot = document.getElementById('midiDot');
  const debugEl = document.getElementById('midiDebug');

  if (state.midiOut) {
    // Send all notes off on previous device
    for (let ch = 0; ch < 16; ch++) {
      state.midiOut.send([0xb0 | ch, 123, 0]);
    }
  }

  state.midiOut = outSel.value ? midiAccess.outputs.get(outSel.value) : null;
  dot.classList.toggle('connected', !!(state.midiOut || state.midiIn));

  const outName = state.midiOut ? state.midiOut.name : 'none';
  const inName = state.midiIn ? state.midiIn.name : 'none';
  debugEl.textContent = `Out: ${outName} | In: ${inName}`;

  if (state.midiOut) {
    console.log('MIDI Output connected:', state.midiOut.name, state.midiOut);
  }
}

function connectInput() {
  const inSel = document.getElementById('midiIn');
  const dot = document.getElementById('midiDot');
  const debugEl = document.getElementById('midiDebug');

  // Disconnect ALL previous input listeners
  if (midiAccess) {
    for (const [, input] of midiAccess.inputs) {
      input.onmidimessage = null;
    }
  }
  state.midiIn = inSel.value ? midiAccess.inputs.get(inSel.value) : null;

  // Listen on ALL MIDI inputs (Electribe 2 has 2 USB interfaces: SOUND + PAD/KNOB)
  let connectedNames = [];
  for (const [id, input] of midiAccess.inputs) {
    input.onmidimessage = onMIDIMessage;
    connectedNames.push(input.name);
    console.log('Listening on input:', input.name, '(id:', id, ')');
  }

  dot.classList.toggle('connected', !!(state.midiOut || state.midiIn));
  const outName = state.midiOut ? state.midiOut.name : 'none';
  const inName = connectedNames.length > 0 ? connectedNames.join(' + ') : 'none';
  const deviceCount = midiAccess.outputs.size + midiAccess.inputs.size;
  debugEl.textContent = `Out: ${outName} | In: ${inName}`;
  if (deviceCount === 0 && navigator.userAgent.includes('Android')) {
    debugEl.textContent = 'No devices. Connect USB and tap dot to rescan.';
  }
  console.log('MIDI inputs listening:', connectedNames.join(', ') || 'none', '| Total devices:', deviceCount);
}

function onMIDIMessage(msg) {
  const [status, data1, data2] = msg.data;
  const cmd = status & 0xf0;
  const ch = status & 0x0f;

  // MIDI Real-Time messages (single byte, no channel)
  if (status === 0xF8) {
    handleMIDIClock(msg);
    return;
  }
  if (status === 0xFA) {
    console.log('>>> MIDI Start received, syncMode:', state.midiSyncMode);
    handleMIDIStart();
    return;
  }
  if (status === 0xFB) {
    console.log('>>> MIDI Continue received');
    handleMIDIContinue();
    return;
  }
  if (status === 0xFC) {
    console.log('>>> MIDI Stop received');
    handleMIDIStop();
    return;
  }

  // Log non-realtime messages
  const hex = Array.from(msg.data).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' ');
  console.log('MIDI Rx:', hex);

  // Show note/CC messages in noteInfo
  if (cmd === 0x90 && data2 > 0) {
    const noteName = NOTES[data1 % 12] + Math.floor(data1 / 12);
    document.getElementById('noteInfo').textContent = `Rx: ${noteName} vel:${data2} ch:${ch+1}`;
  }
  if (cmd === 0xb0) {
    document.getElementById('noteInfo').textContent = `Rx CC${data1}=${data2} ch:${ch+1}`;
  }
}

function handleMIDIClock(msg) {
  if (state.midiSyncMode !== 'slave') return;
  const now = msg.timeStamp;
  state.midiClockCount++;

  // Log first few clock pulses for debugging
  if (state.midiClockCount <= 6) {
    console.log(`MIDI Clock #${state.midiClockCount}, playing:${state.playing}, mode:${state.midiSyncMode}`);
  }

  // BPM analysis: track intervals between pulses
  if (state.lastClockTime > 0) {
    const interval = now - state.lastClockTime;
    if (interval > 0 && interval < 200) { // filter junk (< 300 BPM)
      state.clockPulseTimes.push(interval);
      if (state.clockPulseTimes.length > 96) {
        state.clockPulseTimes.shift();
      }
      const avg = state.clockPulseTimes.reduce((a, b) => a + b, 0) / state.clockPulseTimes.length;
      const bpm = 60000 / (avg * 24);
      if (state.bpmHistory.length > 0) {
        const prev = state.bpmHistory[state.bpmHistory.length - 1];
        state.bpmHistory.push(prev * 0.8 + bpm * 0.2);
      } else {
        state.bpmHistory.push(bpm);
      }
      if (state.bpmHistory.length > 8) {
        state.bpmHistory.shift();
      }
      const finalBPM = state.bpmHistory.reduce((a, b) => a + b, 0) / state.bpmHistory.length;
      state.detectedBPM = Math.round(finalBPM * 10) / 10;
      state.bpm = Math.round(finalBPM);
      document.getElementById('bpmSlider').value = state.bpm;
      document.getElementById('bpmDisplay').textContent = state.detectedBPM;
    }
  }
  state.lastClockTime = now;

  // Advance step every 6 clock pulses (1/16 note at 24 PPQ)
  if (state.midiClockCount % 6 === 0 && state.playing) {
    playStep();
  }
}

function handleMIDIStart() {
  if (state.midiSyncMode !== 'slave') return;
  console.log('MIDI Start received - resetting clock, syncMode:', state.midiSyncMode);
  state.midiClockCount = 0;
  state.lastClockTime = 0;
  state.clockPulseTimes = [];
  state.bpmHistory = [];
  if (!state.playing) {
    state.playing = true;
    document.getElementById('btnPlay').classList.add('playing');
    state.partPlayStep.fill(-1);
    state.playStep = 0;
    playStartTime = performance.now();
    console.log('MIDI Start: playback activated');
  }
}

function handleMIDIContinue() {
  if (state.midiSyncMode !== 'slave') return;
  if (!state.playing) {
    state.playing = true;
    document.getElementById('btnPlay').classList.add('playing');
  }
}

function handleMIDIStop() {
  if (state.midiSyncMode !== 'slave') return;
  state.playing = false;
  document.getElementById('btnPlay').classList.remove('playing');
  stopPlayback();
}

function sendNoteOn(note, velocity = 100, channel = null) {
  if (!state.midiOut || !state.noteSendEnabled) return;
  const ch = channel !== null ? channel : state.midiChannel;
  state.midiOut.send([0x90 | ch, note, velocity]);
}

function sendNoteOff(note, channel = null) {
  if (!state.midiOut || !state.noteSendEnabled) return;
  const ch = channel !== null ? channel : state.midiChannel;
  state.midiOut.send([0x80 | ch, note, 0]);
}

function sendCC(cc, value, channel = null) {
  if (!state.midiOut) return;
  const ch = channel !== null ? channel : state.midiChannel;
  state.midiOut.send([0xb0 | ch, cc, value & 0x7f]);
}

function sendNRPN(msb, lsb, dataMsb, dataLsb, channel = null) {
  if (!state.midiOut) return;
  const ch = channel !== null ? channel : state.midiChannel;
  state.midiOut.send([0xb0 | ch, 0x63, msb]); // NRPN MSB
  state.midiOut.send([0xb0 | ch, 0x62, lsb]); // NRPN LSB
  state.midiOut.send([0xb0 | ch, 0x06, dataMsb]); // Data MSB
  state.midiOut.send([0xb0 | ch, 0x26, dataLsb]); // Data LSB
}

function sendTransport(type) {
  if (!state.midiOut) return;
  const msgs = { play: 0xfa, stop: 0xfc, continue: 0xfb };
  if (msgs[type]) state.midiOut.send([msgs[type]]);
}

function sendClock() {
  if (!state.midiOut) return;
  state.midiOut.send([0xf8]);
}

// ==================== MIDI CLOCK SCHEDULER ====================
let clockInterval = null;

function startClockScheduler() {
  stopClockScheduler();
  const ppq = 24;
  const msPerClock = 60000 / state.bpm / ppq;
  clockInterval = setInterval(() => {
    if (state.playing && state.midiSyncMode === 'master') {
      sendClock();
    } else {
      stopClockScheduler();
    }
  }, msPerClock);
}

function stopClockScheduler() {
  if (clockInterval) {
    clearInterval(clockInterval);
    clockInterval = null;
  }
}

// ==================== UI BUILDERS ====================
function buildPartList() {
  const ul = document.getElementById('partList');
  ul.innerHTML = '';
  PART_NAMES.forEach((name, i) => {
    const li = document.createElement('li');
    li.className = 'part-item' + (i === state.selectedPart ? ' selected' : '');
    li.innerHTML = `<span class="part-num">${i+1}</span><span class="part-name">${name}</span><span class="part-mute" data-part="${i}">${state.mutes[i]?'M':'_'}</span>`;
    li.onclick = (e) => {
      if (e.target.classList.contains('part-mute')) {
        state.mutes[i] = !state.mutes[i];
        e.target.classList.toggle('muted', state.mutes[i]);
        e.target.textContent = state.mutes[i] ? 'M' : '_';
        if (state.mutes[i]) sendCC(123, 0, i);
        return;
      }
      // Save current part settings before switching
      state.partSteps[state.selectedPart] = state.stepCount;
      state.partGridRes[state.selectedPart] = state.gridRes;
      state.partStepsPerBeat[state.selectedPart] = state.stepsPerBeat;
      state.partSwing[state.selectedPart] = state.swing;

      state.selectedPart = i;
      state.midiChannel = i;
      document.getElementById('midiChannel').value = i;

      // Load target part settings
      state.stepCount = state.partSteps[i];
      state.gridRes = state.partGridRes[i];
      state.stepsPerBeat = state.partStepsPerBeat[i];
      state.swing = state.partSwing[i];
      document.getElementById('stepCount').value = state.stepCount;
      document.getElementById('gridRes').value = state.gridRes;
      document.getElementById('swingSlider').value = state.swing;
      document.getElementById('swingVal').textContent = state.swing + '%';

      buildPartList();
      resizePianoRoll();
      updateCCPanel();
      updateLFOUI();
      document.getElementById('btnMFX').classList.toggle('active', state.partMFX[i]);
    };
    ul.appendChild(li);
  });
}
