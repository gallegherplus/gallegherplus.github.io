          <span class="lfo-rate-hz-val" data-i="${i}" ${lfo.rateType!=='hz'?'style="display:none"':''}>${lfo.rateHz||1}Hz</span>
          <label>Depth</label>
          <input type="range" class="lfo-depth" data-i="${i}" min="0" max="100" value="${lfo.depth}">
          <span class="lfo-depth-val">${lfo.depth}%</span>
        </div>
        <div class="lfo-row">
          <label>Dest</label>
          <select class="lfo-dest" data-i="${i}">
            <option value="-1">None</option>
            ${CC_PARAMS.map(p => `<option value="${p.cc}" ${lfo.destination===p.cc?'selected':''}>${p.name}</option>`).join('')}
          </select>
        </div>
        <div class="lfo-row">
          <label>Min</label>
          <input type="range" class="lfo-min" data-i="${i}" min="0" max="127" value="${lfo.min}">
          <span class="lfo-min-val">${lfo.min}</span>
          <label>Max</label>
          <input type="range" class="lfo-max" data-i="${i}" min="0" max="127" value="${lfo.max}">
          <span class="lfo-max-val">${lfo.max}</span>
        </div>
        <div class="lfo-row">
          <label>Shuffle</label>
          <input type="range" class="lfo-shuffle" data-i="${i}" min="0" max="100" value="${lfo.shuffle}">
          <span class="lfo-shuffle-val">${lfo.shuffle}%</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  }

  // Initial waveform render
  for (let i = 0; i < 8; i++) {
    const canvas = container.querySelector(`.lfo-display[data-i="${i}"]`);
    if (canvas) renderLFOWaveform(canvas, partLfos[i]);
  }
}

// Bind LFO event delegation ONCE (not on every rebuild)
function initLFOListeners() {
  const container = document.getElementById('lfoControls');
  if (!container || container._lfoListenersBound) return;
  container._lfoListenersBound = true;

  container.addEventListener('change', (e) => {
    const el = e.target;
    const i = +el.dataset.i;
    if (isNaN(i)) return;
    const lfo = state.partLfos[state.selectedPart][i];
    if (el.classList.contains('lfo-waveform')) {
      lfo.waveform = el.value;
      const canvas = container.querySelector(`.lfo-display[data-i="${i}"]`);
      renderLFOWaveform(canvas, lfo);
    } else if (el.classList.contains('lfo-rate')) {
      lfo.rate = el.value;
    } else if (el.classList.contains('lfo-dest')) {
      const newDest = +el.value;
      if (newDest >= 0) {
        const partLfos = state.partLfos[state.selectedPart];
        for (let j = 0; j < 8; j++) {
          if (j !== i && partLfos[j].active && partLfos[j].destination === newDest) {
            partLfos[j].destination = -1;
            const otherSel = container.querySelector(`.lfo-dest[data-i="${j}"]`);
            if (otherSel) otherSel.value = -1;
          }
        }
        // Auto-enable MFX + MFX Send when targeting MFX X (CC 102) or MFX Y (CC 103)
        if (newDest === 102 || newDest === 103) {
          sendCC(106, 127, state.selectedPart);
          sendCC(105, 127, state.selectedPart);
          state.partCCValues[state.selectedPart][106] = 127;
          state.partCCValues[state.selectedPart][105] = 127;
          state.partMFX[state.selectedPart] = true;
          document.getElementById('btnMFX').classList.add('active');
        }
      }
      lfo.destination = newDest;
    }
  });

  container.addEventListener('input', (e) => {
    const el = e.target;
    const i = +el.dataset.i;
    if (isNaN(i)) return;
    const lfo = state.partLfos[state.selectedPart][i];
    if (el.classList.contains('lfo-depth')) {
      lfo.depth = +el.value;
      el.nextElementSibling.textContent = el.value + '%';
      const canvas = container.querySelector(`.lfo-display[data-i="${i}"]`);
      renderLFOWaveform(canvas, lfo);
    } else if (el.classList.contains('lfo-min')) {
      lfo.min = +el.value;
      el.nextElementSibling.textContent = el.value;
    } else if (el.classList.contains('lfo-max')) {
      lfo.max = +el.value;
      el.nextElementSibling.textContent = el.value;
    } else if (el.classList.contains('lfo-shuffle')) {
      lfo.shuffle = +el.value;
      el.nextElementSibling.textContent = el.value + '%';
    } else if (el.classList.contains('lfo-rate-hz')) {
      lfo.rateHz = +el.value;
      const hzSpan = container.querySelector(`.lfo-rate-hz-val[data-i="${i}"]`);
      if (hzSpan) hzSpan.textContent = (+el.value).toFixed(1) + 'Hz';
    }
  });

  container.addEventListener('click', (e) => {
    const btn = e.target;
    const i = +btn.dataset.i;
    if (isNaN(i)) return;

    if (btn.classList.contains('lfo-toggle')) {
      const lfo = state.partLfos[state.selectedPart][i];
      lfo.active = !lfo.active;
      btn.classList.toggle('active', lfo.active);
      btn.textContent = lfo.active ? 'ON' : 'OFF';
      const canvas = container.querySelector(`.lfo-display[data-i="${i}"]`);
      renderLFOWaveform(canvas, lfo);
    } else if (btn.classList.contains('lfo-mfx-btn')) {
      const cc = +btn.dataset.cc;
      const lfo = state.partLfos[state.selectedPart][i];
      // Toggle: if already assigned, clear it
      if (lfo.destination === cc) {
        lfo.destination = -1;
        btn.classList.remove('active');
      } else {
        // Clear other LFOs on this part targeting same CC
        const partLfos = state.partLfos[state.selectedPart];
        for (let j = 0; j < 8; j++) {
          if (j !== i && partLfos[j].active && partLfos[j].destination === cc) {
            partLfos[j].destination = -1;
            const otherBtn = container.querySelector(`.lfo-mfx-btn[data-i="${j}"][data-cc="${cc}"]`);
            if (otherBtn) otherBtn.classList.remove('active');
            const otherSel = container.querySelector(`.lfo-dest[data-i="${j}"]`);
            if (otherSel) otherSel.value = -1;
          }
        }
        lfo.destination = cc;
        // Update all MFX buttons for this LFO to reflect new state
        container.querySelectorAll(`.lfo-mfx-btn[data-i="${i}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Sync dropdown
        const destSel = container.querySelector(`.lfo-dest[data-i="${i}"]`);
        if (destSel) destSel.value = cc;
        // Auto-enable MFX + MFX Send
        sendCC(106, 127, state.selectedPart);
        sendCC(105, 127, state.selectedPart);
        state.partCCValues[state.selectedPart][106] = 127;
        state.partCCValues[state.selectedPart][105] = 127;
        state.partMFX[state.selectedPart] = true;
        document.getElementById('btnMFX').classList.add('active');
      }
    } else if (btn.classList.contains('lfo-inv-btn')) {
      const lfo = state.partLfos[state.selectedPart][i];
      lfo.invert = !lfo.invert;
      btn.classList.toggle('active', lfo.invert);
      const canvas = container.querySelector(`.lfo-display[data-i="${i}"]`);
      renderLFOWaveform(canvas, lfo);
    } else if (btn.classList.contains('lfo-rate-type')) {
      const lfo = state.partLfos[state.selectedPart][i];
      const isHz = lfo.rateType === 'hz';
      lfo.rateType = isHz ? 'sync' : 'hz';
      btn.textContent = lfo.rateType === 'hz' ? 'Free' : 'Sync';
      btn.classList.toggle('active', lfo.rateType === 'hz');
      const rateSelect = container.querySelector(`.lfo-rate[data-i="${i}"]`);
      const hzSlider = container.querySelector(`.lfo-rate-hz[data-i="${i}"]`);
      const hzSpan = container.querySelector(`.lfo-rate-hz-val[data-i="${i}"]`);
      if (rateSelect) rateSelect.style.display = lfo.rateType === 'hz' ? 'none' : '';
      if (hzSlider) hzSlider.style.display = lfo.rateType === 'hz' ? '' : 'none';
      if (hzSpan) hzSpan.style.display = lfo.rateType === 'hz' ? '' : 'none';
    }
  });
}

function updateLFOUI() {
  buildLFOPanel();
}

// ==================== PIANO ROLL ====================
let pianoCtx, gridCtx, pianoCanvas, gridCanvas;
const pianoWidth = 60;

function initPianoRoll() {
  pianoCanvas = document.getElementById('pianoCanvas');
  gridCanvas = document.getElementById('gridCanvas');
  pianoCtx = pianoCanvas.getContext('2d');
  gridCtx = gridCanvas.getContext('2d');

  resizePianoRoll();
  window.addEventListener('resize', resizePianoRoll);

  // Scroll sync
  const pr = document.getElementById('pianoroll');
  pr.addEventListener('scroll', () => {
    state.viewScrollX = pr.scrollLeft;
    state.viewScrollY = pr.scrollTop;
    renderPianoRoll();
  });

  // Mouse events on grid
  gridCanvas.addEventListener('mousedown', onGridMouseDown);
  gridCanvas.addEventListener('mousemove', onGridMouseMove);
  gridCanvas.addEventListener('mouseup', onGridMouseUp);
  gridCanvas.addEventListener('contextmenu', onGridContextMenu);
  gridCanvas.addEventListener('mouseleave', onGridMouseUp);

  // Touch events for mobile piano roll
  let touchLongPress = null;
  let touchMoved = false;

  gridCanvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchMoved = false;
    const touch = e.touches[0];
    const rect = gridCanvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;

    // Long press detection for context menu
    const existing = getNoteAt(x, y);
    if (existing) {
      touchLongPress = setTimeout(() => {
        // Long press → show context menu
        state.selectedNote = existing;
        const menu = document.getElementById('contextMenu');
        menu.style.display = 'block';
        menu.style.left = Math.min(touch.clientX, window.innerWidth - 150) + 'px';
        menu.style.top = Math.min(touch.clientY, window.innerHeight - 200) + 'px';
        touchLongPress = null;
      }, 500);
    }

    // Simulate mousedown
    onGridMouseDown({ clientX: touch.clientX, clientY: touch.clientY, button: 0, shiftKey: false });
  }, { passive: false });

  gridCanvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    touchMoved = true;
    if (touchLongPress) { clearTimeout(touchLongPress); touchLongPress = null; }
    const touch = e.touches[0];
    onGridMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
  }, { passive: false });

  gridCanvas.addEventListener('touchend', (e) => {
    if (touchLongPress) { clearTimeout(touchLongPress); touchLongPress = null; }
    if (!touchMoved && e.changedTouches[0]) {
      // Tap without move = just click (note added/selected by mousedown)
    }
    onGridMouseUp({});
  });

  gridCanvas.addEventListener('touchcancel', (e) => {
    if (touchLongPress) { clearTimeout(touchLongPress); touchLongPress = null; }
    onGridMouseUp({});
  });

  // Keyboard
  document.addEventListener('keydown', onKeyDown);
}

function resizePianoRoll() {
  const container = document.getElementById('pianoroll');
  const w = container.clientWidth;
  const totalNotes = 12 * state.octaveRange + 1;
  const h = totalNotes * state.noteHeight;

  pianoCanvas.width = pianoWidth;
  pianoCanvas.height = h;
  gridCanvas.width = Math.max(w - pianoWidth, state.stepCount * getStepWidth());
  gridCanvas.height = h;

  container.style.overflow = 'auto';
  renderPianoRoll();
}

function getStepWidth() {
  return 40;
}

function getScaleNotes() {
  const scale = SCALES[state.scale];
  const root = state.rootNote;
  const notes = new Set();
  for (let oct = 0; oct < state.octaveRange; oct++) {
    scale.forEach(interval => {
      const noteNum = root + oct * 12 + interval;
      if (noteNum < 12 * (state.octaveRange + 1)) notes.add(noteNum);
    });
  }
  return notes;
}

function noteInScale(noteNum) {
  if (!state.scaleLock) return true;
  const scaleNotes = getScaleNotes();
  return scaleNotes.has(noteNum % 12);
}

function renderPianoRoll() {
  renderPianoKeys();
  renderGrid();
}

function renderPianoKeys() {
  const ctx = pianoCtx;
  const w = pianoWidth;
  const h = pianoCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const totalNotes = 12 * state.octaveRange + 1;
  const scaleNotes = getScaleNotes();

  for (let i = 0; i < totalNotes; i++) {
    const noteNum = i;
    const noteInOctave = noteNum % 12;
    const y = (totalNotes - 1 - i) * state.noteHeight;
    const isBlack = [1,3,6,8,10].includes(noteInOctave);
    const inScale = scaleNotes.has(noteNum);

    if (state.scaleLock) {
      // Lock ON: only show scale notes, hide others
      if (!inScale) {
        ctx.fillStyle = '#0a0a10';
        ctx.fillRect(0, y, w, state.noteHeight);
        continue;
      }
      // Scale note: bright background
      ctx.fillStyle = isBlack ? '#1a3a1a' : '#1e4e1e';
    } else {
      // Lock OFF: show all notes normally like a real piano
      if (isBlack) {
        ctx.fillStyle = '#1a1a25';
      } else {
        ctx.fillStyle = '#2a2a3a';
      }
    }
    ctx.fillRect(0, y, w, state.noteHeight);

    // Border
    ctx.strokeStyle = state.scaleLock && inScale ? '#00ff8833' : '#222';
    ctx.lineWidth = state.scaleLock && inScale ? 1 : 0.5;
    ctx.beginPath();
    ctx.moveTo(0, y + state.noteHeight);
    ctx.lineTo(w, y + state.noteHeight);
    ctx.stroke();

    // Label
    const oct = Math.floor(noteNum / 12) + state.baseOctave;
    const label = NOTES[noteInOctave] + oct;
    if (state.scaleLock) {
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 9px monospace';
    } else {
      ctx.fillStyle = isBlack ? '#666' : '#999';
      ctx.font = '9px monospace';
    }
    ctx.textAlign = 'right';
    ctx.fillText(label, w - 4, y + state.noteHeight - 3);

    // C notes get a line
    if (noteInOctave === 0) {
      ctx.strokeStyle = state.scaleLock ? '#00ff8844' : '#444';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
  }
}

function renderGrid() {
  const ctx = gridCtx;
  const totalNotes = 12 * state.octaveRange + 1;
  const stepW = getStepWidth();
  const w = state.stepCount * stepW;
  const h = totalNotes * state.noteHeight;

  gridCanvas.width = Math.max(gridCanvas.parentElement.clientWidth - pianoWidth, w);
  gridCanvas.height = h;

  if (typeof triggerAutoSave === 'function') triggerAutoSave();

  ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);

  const scaleNotes = getScaleNotes();

  // Draw scale highlights
  for (let i = 0; i < totalNotes; i++) {
    const noteNum = i;
    const inScale = scaleNotes.has(noteNum);
    const y = (totalNotes - 1 - i) * state.noteHeight;
    if (state.scaleLock && !inScale) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, y, gridCanvas.width, state.noteHeight);
    } else if (inScale) {
      ctx.fillStyle = 'rgba(0,255,136,0.02)';
      ctx.fillRect(0, y, gridCanvas.width, state.noteHeight);
    }
  }

  // Grid lines - horizontal
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= totalNotes; i++) {
    const y = i * state.noteHeight;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(gridCanvas.width, y);
    ctx.stroke();
  }

  // Grid lines - vertical
  for (let s = 0; s <= state.stepCount; s++) {
    const x = s * stepW;
    const isBeat = s % state.stepsPerBeat === 0;
    ctx.strokeStyle = isBeat ? '#2a2a3a' : '#1a1a2a';
    ctx.lineWidth = isBeat ? 1 : 0.5;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, gridCanvas.height);
    ctx.stroke();

    // Step numbers
    if (s < state.stepCount) {
      ctx.fillStyle = isBeat ? '#555' : '#333';
      ctx.font = '8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(s + 1, x + stepW/2, 10);
    }
  }

  // Draw notes
  const partNotes = state.notes.filter(n => n.part === state.selectedPart);
  partNotes.forEach(n => {
    const x = n.step * stepW;
    const y = (totalNotes - 1 - n.note) * state.noteHeight;
    const nw = (n.length || 1) * stepW - 2;
    const nh = state.noteHeight - 2;

    const isSelected = state.selectedNote === n;
    const alpha = n.velocity / 127;

    // Note body
    ctx.fillStyle = isSelected
      ? `rgba(255,0,136,${0.5 + alpha * 0.5})`
      : `rgba(0,255,136,${0.3 + alpha * 0.7})`;
    ctx.fillRect(x + 1, y + 1, nw, nh);

    // Note border
    ctx.strokeStyle = isSelected ? '#ff0088' : '#00cc66';
    ctx.lineWidth = isSelected ? 2 : 1;
    ctx.strokeRect(x + 1, y + 1, nw, nh);

    // Velocity bar
    const vBar = (n.velocity / 127) * nh;
    ctx.fillStyle = isSelected ? '#ff0088' : '#00ff88';
    ctx.fillRect(x + 1, y + 1 + nh - vBar, 2, vBar);
  });

  // Playheads for all active parts
  if (state.playing) {
    const partColors = [
      'rgba(0,255,136,0.25)', 'rgba(255,0,136,0.25)', 'rgba(0,136,255,0.25)',
      'rgba(255,136,0,0.25)', 'rgba(136,0,255,0.25)', 'rgba(0,255,255,0.25)',
      'rgba(255,255,0,0.25)', 'rgba(255,0,0,0.25)', 'rgba(0,255,0,0.25)',
      'rgba(128,128,255,0.25)', 'rgba(255,128,128,0.25)', 'rgba(128,255,128,0.25)',
      'rgba(255,200,0,0.25)', 'rgba(0,200,255,0.25)', 'rgba(200,0,255,0.25)',
      'rgba(200,255,0,0.25)',
    ];
    for (let part = 0; part < 16; part++) {
      if (state.mutes[part]) continue;
      const ps = state.partPlayStep[part];
      if (ps < 0 || ps >= state.stepCount) continue;
      const px = ps * stepW;
      ctx.fillStyle = partColors[part];
      ctx.fillRect(px, 0, stepW, gridCanvas.height);
      if (part === state.selectedPart) {
        ctx.strokeStyle = '#ff0088';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + stepW/2, 0);
        ctx.lineTo(px + stepW/2, gridCanvas.height);
        ctx.stroke();
      }
    }
  }
}

// ==================== NOTE EDITING ====================
function getNoteAt(x, y) {
  const totalNotes = 12 * state.octaveRange + 1;
  const stepW = getStepWidth();
  const step = Math.floor(x / stepW);
  const note = totalNotes - 1 - Math.floor(y / state.noteHeight);

  return state.notes.find(n =>
    n.part === state.selectedPart &&
    n.step === step &&
    note >= n.note && note < n.note + (n.length || 1)
  );
}

function addNote(step, note, velocity = 100, length = 1) {
  // Scale lock - snap to nearest scale note
  if (state.scaleLock && !noteInScale(note % 12)) {
    const scaleNotes = [...getScaleNotes()].sort((a,b) => a - b);
    const nearest = scaleNotes.reduce((prev, curr) =>
      Math.abs(curr - (note % 12)) < Math.abs(prev - (note % 12)) ? curr : prev
    );
    note = note - (note % 12) + nearest;
    if (note < 0 || note >= 12 * state.octaveRange) return;
  }

  if (state.chordMode) {
    // Chord mode: place all chord tones
    const intervals = CHORD_TYPES[state.selectedChordType] || [0, 4, 7];
    const scaleNotesArr = [...getScaleNotes()].sort((a,b) => a - b);
    const rootInOctave = note % 12;

    intervals.forEach((interval, idx) => {
      let chordNote = note + interval;
      // If scale lock, snap each chord tone to nearest scale note
      if (state.scaleLock) {
        const noteInOct = chordNote % 12;
        if (!scaleNotesArr.includes(noteInOct)) {
          const nearest = scaleNotesArr.reduce((prev, curr) =>
            Math.abs(curr - noteInOct) < Math.abs(prev - noteInOct) ? curr : prev
          );
          chordNote = chordNote - noteInOct + nearest;
        }
      }
      if (chordNote < 0 || chordNote >= 12 * state.octaveRange) return;
      if (chordNote === note && idx > 0) return; // skip duplicate root

      const existing = state.notes.find(n =>
        n.part === state.selectedPart && n.step === step && n.note === chordNote
      );
      if (!existing) {
        const n = { part: state.selectedPart, step, note: chordNote, velocity, length };
        state.notes.push(n);
        sendNoteOn(chordNote + 12 * state.baseOctave, velocity);
      }
    });
  } else {
    // Single note mode
    const existing = state.notes.find(n =>
      n.part === state.selectedPart && n.step === step && n.note === note
    );
    if (existing) return;

    const n = { part: state.selectedPart, step, note, velocity, length };
    state.notes.push(n);
    sendNoteOn(note + 12 * state.baseOctave, velocity);
  }

  renderGrid();
}

function deleteNote(note) {
  const idx = state.notes.indexOf(note);
  if (idx >= 0) {
    state.notes.splice(idx, 1);
    const midiNote = note.note + 12 * state.baseOctave;
    sendNoteOff(midiNote);
    if (state.selectedNote === note) state.selectedNote = null;
    renderGrid();
  }
}

function onGridMouseDown(e) {
  if (e.button === 2) return; // right click handled by context menu
  const rect = gridCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const stepW = getStepWidth();
  const totalNotes = 12 * state.octaveRange + 1;

  const existing = getNoteAt(x, y);

  if (existing) {
    if (e.shiftKey) {
      // Delete on shift+click
      deleteNote(existing);
      return;
    }
    // Check if near right edge for resize
    const noteRight = (existing.step + (existing.length || 1)) * stepW;
    if (x > noteRight - 8) {
      state.resizing = { note: existing, startX: x, origLength: existing.length || 1 };
    } else {
      state.dragging = { note: existing, startX: x, startY: y, origStep: existing.step, origNote: existing.note };
    }
    state.selectedNote = existing;
    sendNoteOn(existing.note + 12 * state.baseOctave, existing.velocity);
    renderGrid();
  } else {
    // Add note
    const step = Math.floor(x / stepW);
    const note = totalNotes - 1 - Math.floor(y / state.noteHeight);
    if (step >= 0 && step < state.stepCount && note >= 0 && note < totalNotes) {
      addNote(step, note);
    }
  }
}

function onGridMouseMove(e) {
  const rect = gridCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const stepW = getStepWidth();
  const totalNotes = 12 * state.octaveRange + 1;

  // Update cursor
  const existing = getNoteAt(x, y);
  if (existing) {
    const noteRight = (existing.step + (existing.length || 1)) * stepW;
    gridCanvas.style.cursor = x > noteRight - 8 ? 'ew-resize' : 'grab';
  } else {
    gridCanvas.style.cursor = 'crosshair';
  }

  if (state.dragging) {
    const d = state.dragging;
    const dx = x - d.startX;
    const dy = y - d.startY;
    const stepDelta = Math.round(dx / stepW);
    const noteDelta = Math.round(dy / state.noteHeight);

    d.note.step = Math.max(0, Math.min(state.stepCount - 1, d.origStep + stepDelta));
    d.note.note = Math.max(0, Math.min(totalNotes - 1, d.origNote - noteDelta));

    // Scale lock during drag
    if (state.scaleLock && !noteInScale(d.note.note % 12)) {
      const scaleNotes = [...getScaleNotes()].sort((a,b) => a - b);
      const nearest = scaleNotes.reduce((prev, curr) =>
        Math.abs(curr - (d.note.note % 12)) < Math.abs(prev - (d.note.note % 12)) ? curr : prev
      );
      d.note.note = d.note.note - (d.note.note % 12) + nearest;
    }

    document.getElementById('noteInfo').textContent =
      `Step:${d.note.step+1} Note:${NOTES[d.note.note%12]}${Math.floor(d.note.note/12)+state.baseOctave} Vel:${d.note.velocity}`;
    renderGrid();
  }

  if (state.resizing) {
    const r = state.resizing;
    const dx = x - r.startX;
    const lenDelta = Math.round(dx / stepW);
    r.note.length = Math.max(1, Math.min(state.stepCount - r.note.step, r.origLength + lenDelta));
    renderGrid();
  }
}

function onGridMouseUp(e) {
  if (state.dragging) {
    const d = state.dragging;
    // Update MIDI: off old note, on new
    sendNoteOff(d.origNote + 12 * state.baseOctave);
    sendNoteOn(d.note.note + 12 * state.baseOctave, d.note.velocity);
    state.dragging = null;
  }
  if (state.resizing) {
    state.resizing = null;
  }
  renderGrid();
}

function onGridContextMenu(e) {
  e.preventDefault();
  const rect = gridCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const note = getNoteAt(x, y);
  if (!note) return;

  state.selectedNote = note;
  const menu = document.getElementById('contextMenu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';

  menu.onclick = (ev) => {
    const action = ev.target.dataset.action;
    if (action === 'delete') deleteNote(note);
    else if (action === 'octup') { note.note = Math.min(12*state.octaveRange-1, note.note+12); renderGrid(); }
    else if (action === 'octdown') { note.note = Math.max(0, note.note-12); renderGrid(); }
    else if (action === 'duplicate') {
      const newNote = {...note, step: note.step + (note.length||1)};
      if (newNote.step < state.stepCount) state.notes.push(newNote);
      renderGrid();
    }
    else if (action === 'velocity') {
      const v = prompt('Velocity (1-127):', note.velocity);
      if (v) note.velocity = Math.max(1, Math.min(127, +v));
      renderGrid();
    }
    menu.style.display = 'none';
  };
}

document.addEventListener('click', () => {
  document.getElementById('contextMenu').style.display = 'none';
});

// ==================== KEYBOARD ====================
function onKeyDown(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  switch(e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'Delete':
    case 'Backspace':
      if (state.selectedNote) deleteNote(state.selectedNote);
      break;
    case 'ArrowLeft':
      if (state.selectedNote) {
        state.selectedNote.step = Math.max(0, state.selectedNote.step - 1);
        renderGrid();
      }
      break;
    case 'ArrowRight':
      if (state.selectedNote) {
        state.selectedNote.step = Math.min(state.stepCount-1, state.selectedNote.step + 1);
        renderGrid();
      }
      break;
    case 'ArrowUp':
      if (state.selectedNote) {
        state.selectedNote.note = Math.min(12*state.octaveRange-1, state.selectedNote.note + 1);
        renderGrid();
      }
      break;
    case 'ArrowDown':
      if (state.selectedNote) {
        state.selectedNote.note = Math.max(0, state.selectedNote.note - 1);
        renderGrid();
      }
      break;
  }
}

// ==================== TRANSPORT ====================
let playInterval = null;
let playStartTime = 0;
let clockTimers = [];

function togglePlay() {
  state.playing = !state.playing;
  const btn = document.getElementById('btnPlay');
  btn.classList.toggle('playing', state.playing);

  if (state.playing) {
    state.partPlayStep.fill(-1);
    state.playStep = 0;
    playStartTime = performance.now();
    if (state.midiSyncMode !== 'slave') {
      sendTransport('play');
      startPlayback();
    }
  } else {
    if (state.midiSyncMode !== 'slave') {
      sendTransport('stop');
    }
    stopPlayback();
  }
  renderGrid();
}

function startPlayback() {
  playStartTime = performance.now();
  initAudioContext();
  resumeAudioContext();
  // Use Web Audio API scheduler (works in background)
  startAudioScheduler();
  if (state.midiSyncMode === 'master') {
    startClockScheduler();
  }
}

function stopPlayback() {
  if (playInterval) clearInterval(playInterval);
  playInterval = null;
  stopAudioScheduler();
  stopClockScheduler();
  clockTimers.forEach(t => clearTimeout(t));
  clockTimers = [];
  state.playStep = -1;
  state.partPlayStep.fill(-1);
  for (let ch = 0; ch < 16; ch++) {
    if (state.midiOut) state.midiOut.send([0xb0 | ch, 123, 0]);
  }
  renderGrid();
}

function continuePlayback() {
  if (!state.playing) {
    state.playing = true;
    document.getElementById('btnPlay').classList.add('playing');
    startPlayback();
  }
}

function playStep() {
  const prevStep = state.playStep;
  state.playStep = (state.playStep + 1) % state.stepCount;

  // Play all parts simultaneously
  for (let part = 0; part < 16; part++) {
    if (state.mutes[part]) continue;

    const partStepCount = state.partSteps[part];
    if (partStepCount <= 0) continue;

    // Advance this part's playhead independently
    const prevPartStep = state.partPlayStep[part];
    state.partPlayStep[part] = (state.partPlayStep[part] + 1) % partStepCount;

    // Note off for previous step
    state.notes
      .filter(n => n.part === part && n.step === prevPartStep)
      .forEach(n => {
        sendNoteOff(n.note + 12 * state.baseOctave, part);
      });

    // Note on for current step
    state.notes
      .filter(n => n.part === part && n.step === state.partPlayStep[part])
      .forEach(n => {
        sendNoteOn(n.note + 12 * state.baseOctave, n.velocity, part);
        const baseDur = (60000 / state.bpm / state.partStepsPerBeat[part]) * (n.length || 1);
        // Apply swing: delay odd steps
        let swingDelay = 0;
        if (state.partSwing[part] !== 0 && state.partPlayStep[part] % 2 === 1) {
          swingDelay = baseDur * (state.partSwing[part] / 100) * 0.5;
        }
        const dur = (baseDur - swingDelay) * 0.9;
        setTimeout(() => sendNoteOff(n.note + 12 * state.baseOctave, part), Math.max(10, dur));
      });
  }

  renderGrid();
}

// ==================== WEB AUDIO API SCHEDULER ====================
// AudioContext continues running in background on Android/iOS
let audioCtx = null;
let audioGainNode = null;
let audioSchedulerTimer = null;
let audioNextStepTime = 0;
let audioCurrentStep = 0;
const AUDIO_LOOKAHEAD = 0.1;   // seconds to look ahead
const AUDIO_SCHEDULE_INTERVAL = 25; // ms between scheduler checks

function initAudioContext() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioGainNode = audioCtx.createGain();
    audioGainNode.gain.value = 0;
    audioGainNode.connect(audioCtx.destination);
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(audioGainNode);
    src.start(0);
    console.log('AudioContext initialized — background timing active');
  } catch(e) {
    console.warn('AudioContext init failed:', e);
  }
}

function resumeAudioContext() {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function startAudioScheduler() {
  if (!audioCtx) initAudioContext();
  resumeAudioContext();
  audioNextStepTime = audioCtx.currentTime + 0.05;
  audioCurrentStep = 0;
  scheduleAudioSteps();
}

function stopAudioScheduler() {
  if (audioSchedulerTimer) clearTimeout(audioSchedulerTimer);
  audioSchedulerTimer = null;
}

function scheduleAudioSteps() {
  if (!state.playing || !audioCtx) return;
  while (audioNextStepTime < audioCtx.currentTime + AUDIO_LOOKAHEAD) {
    playStep();
    const msPerBeat = 60000 / state.bpm;
    const msPerStep = msPerBeat / state.stepsPerBeat;
    audioNextStepTime += msPerStep / 1000;
    audioCurrentStep++;
  }
  audioSchedulerTimer = setTimeout(scheduleAudioSteps, AUDIO_SCHEDULE_INTERVAL);
}

// ==================== LFO ENGINE ====================
const RATE_MAP = {
  '1/1': 0.25, '1/2d': 0.375, '1/2': 0.5, '1/2t': 0.75,
  '1/4d': 0.75, '1/4': 1, '1/4t': 1.5,
  '1/8d': 1.5, '1/8': 2, '1/8t': 3,
  '1/16d': 3, '1/16': 4, '1/16t': 6,
  '1/32d': 6, '1/32': 8, '1/32t': 12,
  '2:1': 0.125, '4:1': 0.0625, '8:1': 0.03125, '16:1': 0.015625,
};

const WAVEFORMS = {
  sine: t => Math.sin(t * Math.PI * 2),
  triangle: t => 1 - 4 * Math.abs(t - 0.5),
  saw: t => 2 * (t % 1) - 1,
  square: t => (t % 1) < 0.5 ? 1 : -1,
  sampleHold: null,
};

let shValues = new Array(256).fill(0);
let shLastIdx = -1;
function sampleHoldWave(t) {
  const idx = Math.floor(t * 4) % 256;
  if (idx !== shLastIdx) {
    shValues[idx] = Math.random() * 2 - 1;
    shLastIdx = idx;
  }
  return shValues[idx];
}

function getLFOFrequency(lfo) {
  if (lfo.rateType === 'hz') return lfo.rateHz;
  const beatsPerSec = state.bpm / 60;
  return beatsPerSec * (RATE_MAP[lfo.rate] || 1);
}

function getLFOValue(lfo, time) {
  if (!lfo.active) return null;
  const freq = getLFOFrequency(lfo);
  // Use the phase passed in (from LFO engine loop), not recalculated from time
  let t = lfo.phase;
  // Invert: flip waveform horizontally
  if (lfo.invert) t = 1 - t;
  let val;
  if (lfo.waveform === 'sampleHold') {
    val = sampleHoldWave(t * 4);
  } else {
    val = (WAVEFORMS[lfo.waveform] || WAVEFORMS.sine)(t);
  }
  const depth = lfo.depth / 100;
  const centered = val * depth;
  const mapped = lfo.min + (centered + 1) / 2 * (lfo.max - lfo.min);
  return Math.round(Math.max(0, Math.min(127, mapped)));
}

let lfoAnimFrame = null;
function initLFOLoop() {
  state.lfoLastTime = performance.now() / 1000;
  function loop() {
    const now = performance.now() / 1000;
    const dt = now - state.lfoLastTime;
    state.lfoLastTime = now;

    // Run LFOs for ALL parts simultaneously
    for (let part = 0; part < 16; part++) {
      if (state.mutes[part]) continue;
      const partLfos = state.partLfos[part];
      for (let i = 0; i < 8; i++) {
        const lfo = partLfos[i];
        if (!lfo.active || lfo.destination < 0) continue;
        lfo.phase += dt * getLFOFrequency(lfo);
        lfo.phase %= 1;

        let phase = lfo.phase;
        if (lfo.shuffle > 0) {
          const stepPos = Math.floor(phase * 4);
          if (stepPos % 2 === 1) {
            phase += (lfo.shuffle / 100) * 0.25;
            phase %= 1;
          }
        }

        const val = getLFOValue({...lfo, phase}, now);
        if (val !== null) {
          sendCC(lfo.destination, val, part);
          // Only update CC slider UI if this is the currently selected part
          if (part === state.selectedPart) {
            updateCCSlider(lfo.destination, val);
          }
        }
      }
    }
    lfoAnimFrame = requestAnimationFrame(loop);
  }
  // Use setInterval for background-safe LFO updates (rAF throttles in background)
  setInterval(loop, 16); // ~60fps
  lfoAnimFrame = requestAnimationFrame(loop);
}

function renderLFOWaveform(canvas, lfo) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Background
  ctx.fillStyle = '#0a0a10';
  ctx.fillRect(0, 0, w, h);

  // Center line
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();

  // Waveform
  ctx.strokeStyle = lfo.active ? '#00ff88' : '#333';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x < w; x++) {
    let t = x / w;
    if (lfo.invert) t = 1 - t;
    let val;
    if (lfo.waveform === 'sampleHold') {
      val = sampleHoldWave(t * 4);
    } else {
      val = (WAVEFORMS[lfo.waveform] || WAVEFORMS.sine)(t);
    }
    const y = h / 2 - val * (h / 2 - 4) * (lfo.depth / 100);
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Phase indicator
  if (lfo.active) {
    const px = lfo.phase * w;
    ctx.strokeStyle = '#ff0088';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, 0);
    ctx.lineTo(px, h);
    ctx.stroke();
  }
}

// ==================== RANDOMIZER ====================
function randomizeNotes() {
  const scaleNotes = [...getScaleNotes()];
  if (scaleNotes.length === 0) return;

  state.notes = state.notes.filter(n => n.part !== state.selectedPart);

  const minOct = Math.max(0, +document.getElementById('randOctMin').value);
  const maxOct = Math.min(state.octaveRange, +document.getElementById('randOctMax').value);
  state.randOctMin = minOct;
  state.randOctMax = maxOct;

  // Build note pool within octave range
  const notePool = [];
  for (let oct = minOct; oct <= maxOct; oct++) {
    scaleNotes.forEach(n => {
      const noteNum = oct * 12 + (n % 12);
      if (noteNum >= 0 && noteNum < 12 * state.octaveRange) {
        notePool.push(noteNum);
      }
    });
  }
  if (notePool.length === 0) return;

  const density = Math.floor(state.stepCount * 0.4);
  for (let i = 0; i < density; i++) {
    const step = Math.floor(Math.random() * state.stepCount);
    const note = notePool[Math.floor(Math.random() * notePool.length)];
    const velocity = 60 + Math.floor(Math.random() * 67);
    const length = Math.random() < 0.7 ? 1 : Math.floor(Math.random() * 3) + 1;

    if (!state.notes.find(n => n.part === state.selectedPart && n.step === step)) {
      state.notes.push({ part: state.selectedPart, step, note, velocity, length });
    }
  }

  state.notes.sort((a, b) => a.step - b.step);
  renderGrid();
}

function generateStylePattern() {
  const style = STYLE_PATTERNS[state.selectedStyle];
  if (!style) return;

  state.notes = state.notes.filter(n => n.part !== state.selectedPart);

  const scaleNotes = [...getScaleNotes()].sort((a,b) => a - b);
  const minOct = Math.max(0, state.randOctMin);
  const maxOct = Math.min(state.octaveRange - 1, state.randOctMax);
  const baseOct = Math.floor((minOct + maxOct) / 2);
  const isPoly = state.melodyMode === 'poly';

  // Set BPM from style
  const bpm = style.bpm[0] + Math.floor(Math.random() * (style.bpm[1] - style.bpm[0]));
  state.bpm = bpm;
  document.getElementById('bpmSlider').value = bpm;
  document.getElementById('bpmDisplay').textContent = bpm;

  // Generate melody notes
  if (style.melody) {
    style.melody.forEach(h => {
      if (h.step >= state.stepCount) return;
      const scaleIdx = ((h.n % scaleNotes.length) + scaleNotes.length) % scaleNotes.length;
      const octOffset = baseOct + (h.oct || 0) + Math.floor(h.n / scaleNotes.length);
      const noteNum = octOffset * 12 + scaleNotes[scaleIdx];
      if (noteNum < 0 || noteNum >= 12 * state.octaveRange) return;
      const vel = h.vel || 100;
      const len = h.l || 1;
      if (!state.notes.find(n => n.part === state.selectedPart && n.step === h.step && n.note === noteNum)) {
        state.notes.push({ part: state.selectedPart, step: h.step, note: noteNum, velocity: vel, length: len });
      }
    });
  }

  // Generate chords (poly mode only)
  if (isPoly && style.chords) {
    style.chords.forEach(ch => {
      if (ch.step >= state.stepCount) return;
      ch.degrees.forEach(deg => {
        const scaleIdx = ((deg % scaleNotes.length) + scaleNotes.length) % scaleNotes.length;
        const octOffset = baseOct + (ch.oct || 0) + Math.floor(deg / scaleNotes.length);
        const noteNum = octOffset * 12 + scaleNotes[scaleIdx];
        if (noteNum < 0 || noteNum >= 12 * state.octaveRange) return;
        const vel = ch.vel || 70;
        const len = ch.l || 4;
        if (!state.notes.find(n => n.part === state.selectedPart && n.step === ch.step && n.note === noteNum)) {
          state.notes.push({ part: state.selectedPart, step: ch.step, note: noteNum, velocity: vel, length: len });
        }
      });
    });
  }

  state.notes.sort((a, b) => a.step - b.step);
  renderGrid();
}

function mutateMelody() {
  const partNotes = state.notes.filter(n => n.part === state.selectedPart);
  if (partNotes.length === 0) return;

  const scaleNotes = [...getScaleNotes()].sort((a,b) => a - b);
  const totalNotes = 12 * state.octaveRange;

  partNotes.forEach(n => {
    const r = Math.random();

    if (r < 0.25) {
      // Transpose by scale step (stay in scale)
      const scaleStep = Math.random() < 0.5 ? 1 : -1;
      const currentScaleIdx = scaleNotes.indexOf(n.note % 12);
      if (currentScaleIdx >= 0) {
        const newScaleIdx = ((currentScaleIdx + scaleStep) % scaleNotes.length + scaleNotes.length) % scaleNotes.length;
        const octDiff = Math.floor((currentScaleIdx + scaleStep) / scaleNotes.length);
        n.note = n.note + (scaleNotes[newScaleIdx] - scaleNotes[currentScaleIdx]) + octDiff * 12;
      }
    } else if (r < 0.45) {
      // Shift octave
      n.note += Math.random() < 0.5 ? 12 : -12;
    } else if (r < 0.65) {
      // Change velocity
      n.velocity = Math.max(40, Math.min(127, n.velocity + Math.floor(Math.random() * 40) - 20));
    } else if (r < 0.80) {
      // Change length
      n.length = Math.max(1, Math.min(8, n.length + (Math.random() < 0.5 ? 1 : -1)));
    } else if (r < 0.90) {
      // Move step
      n.step = (n.step + (Math.random() < 0.5 ? 1 : -1) + state.stepCount) % state.stepCount;
    } else {
      // Delete note
      n._delete = true;
    }

    // Clamp to range
    n.note = Math.max(0, Math.min(totalNotes - 1, n.note));
    // Ensure in scale
    if (state.scaleLock && !scaleNotes.includes(n.note % 12)) {
      const nearest = scaleNotes.reduce((prev, curr) =>
        Math.abs(curr - (n.note % 12)) < Math.abs(prev - (n.note % 12)) ? curr : prev
      );
      n.note = n.note - (n.note % 12) + nearest;
      n.note = Math.max(0, Math.min(totalNotes - 1, n.note));
    }
  });

  // Remove deleted notes
  state.notes = state.notes.filter(n => !n._delete);
  state.notes.sort((a, b) => a.step - b.step);
  renderGrid();
}

function clearNotes() {
  state.notes = state.notes.filter(n => n.part !== state.selectedPart);
  state.selectedNote = null;
  renderGrid();
}

function shiftNotes(dir) {
  const partNotes = state.notes.filter(n => n.part === state.selectedPart);
  partNotes.forEach(n => {
    n.step = (n.step + dir + state.stepCount) % state.stepCount;
  });
  renderGrid();
}

function transposeOctave(dir) {
  const partNotes = state.notes.filter(n => n.part === state.selectedPart);
  partNotes.forEach(n => {
    n.note = Math.max(0, Math.min(12 * state.octaveRange - 1, n.note + dir * 12));
  });
  renderGrid();
}

// ==================== EVENT LISTENERS ====================
function initEventListeners() {
  document.getElementById('btnPlay').onclick = togglePlay;
  document.getElementById('btnStop').onclick = () => {
    state.playing = false;
    document.getElementById('btnPlay').classList.remove('playing');
    sendTransport('stop');
    stopPlayback();
  };
  document.getElementById('btnRec').onclick = () => {
    document.getElementById('btnRec').classList.toggle('active');
  };

  document.getElementById('bpmSlider').oninput = (e) => {
    state.bpm = +e.target.value;
    document.getElementById('bpmDisplay').textContent = state.bpm;
    if (state.playing) { stopPlayback(); startPlayback(); }
  };

  document.getElementById('swingSlider').oninput = (e) => {
    state.swing = +e.target.value;
    state.partSwing[state.selectedPart] = state.swing;
    document.getElementById('swingVal').textContent = state.swing + '%';
    sendCC(0x5a, Math.round((state.swing + 50) * 127 / 100));
  };

  document.getElementById('stepCount').onchange = (e) => {
    state.stepCount = Math.max(1, Math.min(64, +e.target.value));
    state.partSteps[state.selectedPart] = state.stepCount;
    resizePianoRoll();
  };

  document.getElementById('gridRes').onchange = (e) => {
    state.gridRes = +e.target.value;
    state.stepsPerBeat = state.gridRes <= 4 ? 4 : state.gridRes <= 8 ? 2 : 1;
    state.partGridRes[state.selectedPart] = state.gridRes;
    state.partStepsPerBeat[state.selectedPart] = state.stepsPerBeat;
    if (state.playing) { stopPlayback(); startPlayback(); }
    renderGrid();
  };

  document.getElementById('scaleLock').onchange = (e) => {
    state.scaleLock = e.target.checked;
    renderPianoRoll();
  };

  document.getElementById('btnRefreshMidi').onclick = () => {
    if (midiAccess) {
      enumerateDevices(midiAccess);
    } else {
      initMIDI();
    }
  };

  document.getElementById('btnTestMidi').onclick = () => {
    if (!state.midiOut) {
      document.getElementById('noteInfo').textContent = 'No MIDI output connected';
      return;
    }
    const ch = state.midiChannel;
    const note = 60; // C4
    state.midiOut.send([0x90 | ch, note, 100]);
    document.getElementById('noteInfo').textContent = `Sent: C4 vel:100 ch:${ch+1}`;
    setTimeout(() => { state.midiOut.send([0x80 | ch, note, 0]); }, 300);
  };

  document.getElementById('midiSyncMode').onchange = (e) => {
    state.midiSyncMode = e.target.value;
    const hint = document.getElementById('syncHint');
    const noteInfo = document.getElementById('noteInfo');
    if (state.midiSyncMode === 'slave') {
      if (state.playing) stopPlayback();
      hint.style.display = '';
      hint.textContent = 'E2: Global > Clock=Ext.USB or Auto';
      noteInfo.textContent = 'SLAVE: Waiting for MIDI Clock...';
      noteInfo.style.color = 'var(--accent3)';
    } else if (state.midiSyncMode === 'master') {
      hint.style.display = '';
      hint.textContent = 'E2: Global > Clock=Ext.USB or Auto';
      noteInfo.textContent = 'MASTER: Send Start/Clock to E2';
      noteInfo.style.color = 'var(--accent)';
    } else {
      hint.style.display = 'none';
      noteInfo.textContent = '--';
      noteInfo.style.color = '';
    }
  };

  document.getElementById('btnRandomize').onclick = randomizeNotes;
  document.getElementById('btnGenerate').onclick = generateStylePattern;
  document.getElementById('btnMutate').onclick = mutateMelody;
  document.getElementById('btnClear').onclick = clearNotes;
  document.getElementById('btnShiftLeft').onclick = () => shiftNotes(-1);
  document.getElementById('btnShiftRight').onclick = () => shiftNotes(1);
  document.getElementById('btnOctUp').onclick = () => transposeOctave(1);
  document.getElementById('btnOctDown').onclick = () => transposeOctave(-1);

  // Style & octave range
  document.getElementById('styleSelect').onchange = (e) => { state.selectedStyle = e.target.value; };
  document.getElementById('randOctMin').onchange = (e) => { state.randOctMin = Math.max(0, Math.min(8, +e.target.value)); };
  document.getElementById('randOctMax').onchange = (e) => { state.randOctMax = Math.max(0, Math.min(8, +e.target.value)); };
  document.getElementById('melodyMode').onchange = (e) => { state.melodyMode = e.target.value; };

  // Note Send toggle (send notes vs clock-only)
  const btnNoteSend = document.getElementById('btnNoteSend');
  btnNoteSend.classList.toggle('active', state.noteSendEnabled);
  btnNoteSend.onclick = () => {
    state.noteSendEnabled = !state.noteSendEnabled;
    btnNoteSend.classList.toggle('active', state.noteSendEnabled);
    if (!state.noteSendEnabled) {
      // All notes off when disabling
      if (state.midiOut) {
        for (let ch = 0; ch < 16; ch++) {
          state.midiOut.send([0xb0 | ch, 123, 0]);
        }
      }
    }
  };

  // MFX On/Off toggle (also toggles MFX Send for the part)
  const btnMFX = document.getElementById('btnMFX');
  btnMFX.classList.toggle('active', state.partMFX[state.selectedPart]);
  btnMFX.onclick = () => {
    const part = state.selectedPart;
    state.partMFX[part] = !state.partMFX[part];
    btnMFX.classList.toggle('active', state.partMFX[part]);
    sendCC(106, state.partMFX[part] ? 127 : 0, part);
    sendCC(105, state.partMFX[part] ? 127 : 0, part);
    state.partCCValues[part][106] = state.partMFX[part] ? 127 : 0;
    state.partCCValues[part][105] = state.partMFX[part] ? 127 : 0;
  };

  // Chord mode toggle
  document.getElementById('btnChordMode').onclick = () => {
    state.chordMode = !state.chordMode;
    document.getElementById('btnChordMode').classList.toggle('active', state.chordMode);
  };

  // MIDI Sync mode
  document.getElementById('midiSyncMode').onchange = (e) => {
    state.midiSyncMode = e.target.value;
    if (state.midiSyncMode === 'slave' && state.playing) {
      stopPlayback();
    }
    // Show status in noteInfo
    const noteInfo = document.getElementById('noteInfo');
    if (state.midiSyncMode === 'slave') {
      noteInfo.textContent = 'SLAVE: Waiting for MIDI Clock...';
      noteInfo.style.color = 'var(--accent3)';
    } else if (state.midiSyncMode === 'master') {
      noteInfo.textContent = 'MASTER: Sending MIDI Clock';
      noteInfo.style.color = 'var(--accent)';
    } else {
      noteInfo.textContent = '--';
      noteInfo.style.color = '';
    }
  };

  // Panel tabs
  document.querySelectorAll('.panel-tabs .tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.panel-tabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      if (target) {
        document.getElementById('ccTab').style.display = target === 'cc' ? '' : 'none';
        document.getElementById('lfoTab').style.display = target === 'lfo' ? '' : 'none';
      }
    };
  });

  // Close panel button (mobile)
  const closeBtn = document.getElementById('btnClosePanel');
  if (closeBtn) {
    closeBtn.onclick = () => {
      const panel = document.getElementById('ccPanel');
      panel.style.display = panel.style.display === 'none' ? '' : 'none';
    };
  }

  // Mobile floating panel toggle
  const toggleBtn = document.getElementById('btnTogglePanel');
  if (toggleBtn) {
    toggleBtn.onclick = () => {
      const panel = document.getElementById('ccPanel');
      if (panel.style.display === 'none') {
        panel.style.display = '';
        toggleBtn.textContent = '✕';
      } else {
        panel.style.display = 'none';
        toggleBtn.textContent = '🎛️';
      }
    };
  }

  // Preset panel
  const btnOpenPresets = document.getElementById('btnOpenPresets');
  const btnClosePresets = document.getElementById('btnClosePresets');
  const btnSavePreset = document.getElementById('btnSavePreset');
  const btnExportAll = document.getElementById('btnExportAll');
  const btnImportFile = document.getElementById('btnImportFile');
  const presetFileInput = document.getElementById('presetFileInput');

  if (btnOpenPresets) btnOpenPresets.onclick = openPresetPanel;
  if (btnClosePresets) btnClosePresets.onclick = closePresetPanel;
  if (btnSavePreset) btnSavePreset.onclick = () => {
    const name = prompt('Preset name:', 'My Preset');
    if (name) { savePreset(name); renderPresetList(); }
  };
  if (btnExportAll) btnExportAll.onclick = exportAllPresets;
  if (btnImportFile) btnImportFile.onclick = () => presetFileInput.click();
  if (presetFileInput) presetFileInput.onchange = e => {
    if (e.target.files[0]) importPresetsFromFile(e.target.files[0]);
    e.target.value = '';
  };

  updateAutosaveInfo();

  // Restore autosave on load
  const presets = getSavedPresets();
  if (presets['__autosave__']) {
    if (confirm('Restore last session?')) {
      setPresetData(presets['__autosave__']);
    }
  }

  // Auto-save on state changes (debounced)
  document.addEventListener('change', e => {
    if (e.target.closest('.transport, .pianoroll-toolbar, .sidebar, .right-panel, .header')) {
      triggerAutoSave();
    }
  });
}

// ==================== PRESETS ====================
const PRESET_STORAGE_KEY = 'hacktribe_presets';
let autoSaveTimer = null;

function getPresetData() {
  return {
    v: 1, name: '', timestamp: Date.now(),
    bpm: state.bpm, swing: state.swing, rootNote: state.rootNote, scale: state.scale,
    scaleLock: state.scaleLock, midiChannel: state.midiChannel, midiSyncMode: state.midiSyncMode,
    chordMode: state.chordMode, selectedChordType: state.selectedChordType,
    randOctMin: state.randOctMin, randOctMax: state.randOctMax,
    selectedStyle: state.selectedStyle, melodyMode: state.melodyMode,
    noteSendEnabled: state.noteSendEnabled, octaveRange: state.octaveRange,
    baseOctave: state.baseOctave, selectedPart: state.selectedPart,
    partSteps: state.partSteps.slice(), partGridRes: state.partGridRes.slice(),
    partSwing: state.partSwing.slice(), mutes: state.mutes.slice(), partMFX: state.partMFX.slice(),
    partCCValues: state.partCCValues.map(v => Object.assign({}, v)),
    partLfos: state.partLfos.map(part => part.map(lfo => ({
      active: lfo.active, waveform: lfo.waveform, rate: lfo.rate,
      rateType: lfo.rateType, rateHz: lfo.rateHz, depth: lfo.depth,
      destination: lfo.destination, min: lfo.min, max: lfo.max,
      shuffle: lfo.shuffle, invert: lfo.invert
    }))),
    notes: state.notes.map(n => ({ part: n.part, step: n.step, note: n.note, velocity: n.velocity, length: n.length }))
  };
}

function setPresetData(data) {
  if (!data || data.v !== 1) return false;
  state.bpm = data.bpm ?? 120;
  state.swing = data.swing ?? 0;
  state.rootNote = data.rootNote ?? 0;
  state.scale = data.scale ?? 'Minor';
  state.scaleLock = data.scaleLock ?? true;
  state.midiChannel = data.midiChannel ?? 0;
  state.midiSyncMode = data.midiSyncMode ?? 'off';
  state.chordMode = data.chordMode ?? false;
  state.selectedChordType = data.selectedChordType ?? 'major';
  state.randOctMin = data.randOctMin ?? 2;
  state.randOctMax = data.randOctMax ?? 4;
  state.selectedStyle = data.selectedStyle ?? 'House';
  state.melodyMode = data.melodyMode ?? 'mono';
  state.noteSendEnabled = data.noteSendEnabled ?? true;
  state.octaveRange = data.octaveRange ?? 5;
  state.baseOctave = data.baseOctave ?? 2;
  if (data.partSteps) for (let i = 0; i < 16; i++) state.partSteps[i] = data.partSteps[i] ?? 16;
  if (data.partGridRes) for (let i = 0; i < 16; i++) state.partGridRes[i] = data.partGridRes[i] ?? 4;
  if (data.partSwing) for (let i = 0; i < 16; i++) state.partSwing[i] = data.partSwing[i] ?? 0;
  if (data.mutes) for (let i = 0; i < 16; i++) state.mutes[i] = data.mutes[i] ?? false;
  if (data.partMFX) for (let i = 0; i < 16; i++) state.partMFX[i] = data.partMFX[i] ?? false;
  if (data.partCCValues) for (let i = 0; i < 16; i++) state.partCCValues[i] = data.partCCValues[i] ?? {};
  if (data.partLfos) for (let i = 0; i < 16; i++) for (let j = 0; j < 8; j++) {
    const src = data.partLfos[i]?.[j];
    if (src) { const l = state.partLfos[i][j]; Object.assign(l, { active:src.active??false, waveform:src.waveform??'sine', rate:src.rate??'1/4', rateType:src.rateType??'sync', rateHz:src.rateHz??1, depth:src.depth??50, destination:src.destination??-1, min:src.min??0, max:src.max??127, shuffle:src.shuffle??0, invert:src.invert??false }); }
  }
  state.notes = (data.notes || []).map(n => ({ part:n.part, step:n.step, note:n.note, velocity:n.velocity, length:n.length }));
  if (typeof data.selectedPart === 'number' && data.selectedPart >= 0 && data.selectedPart < 16) state.selectedPart = data.selectedPart;
  selectPart(state.selectedPart);
  document.getElementById('bpmDisplay').textContent = state.bpm;
  document.getElementById('bpmSlider').value = state.bpm;
  document.getElementById('swingSlider').value = state.swing;
  document.getElementById('swingVal').textContent = state.swing + '%';
  document.getElementById('rootNote').value = state.rootNote;
  document.getElementById('scaleSelect').value = state.scale;
  document.getElementById('scaleLock').checked = state.scaleLock;
  document.getElementById('stepCount').value = state.partSteps[state.selectedPart];
  document.getElementById('gridRes').value = state.partGridRes[state.selectedPart];
  document.getElementById('midiChannel').value = state.midiChannel;
  document.getElementById('midiSyncMode').value = state.midiSyncMode;
  document.getElementById('chordType').value = state.selectedChordType;
  document.getElementById('randOctMin').value = state.randOctMin;
  document.getElementById('randOctMax').value = state.randOctMax;
  document.getElementById('styleSelect').value = state.selectedStyle;
  document.getElementById('melodyMode').value = state.melodyMode;
  updateNoteSendBtn(); updateMFXBtn(); updateChordBtn();
  buildCCPanel(); buildLFOPanel(); initLFOListeners();
  drawPiano(); drawGrid();
  return true;
}

function updateNoteSendBtn() { const b = document.getElementById('btnNoteSend'); if (b) b.style.opacity = state.noteSendEnabled ? '1' : '0.5'; }
function updateMFXBtn() { const b = document.getElementById('btnMFX'); if (b) b.style.opacity = state.partMFX[state.selectedPart] ? '1' : '0.5'; }
function updateChordBtn() { const b = document.getElementById('btnChordMode'); if (b) b.style.opacity = state.chordMode ? '1' : '0.5'; }

// --- localStorage ---
function getSavedPresets() { try { return JSON.parse(localStorage.getItem(PRESET_STORAGE_KEY)) || {}; } catch { return {}; } }
function savePresetsToStorage(p) { localStorage.setItem(PRESET_STORAGE_KEY, JSON.stringify(p)); }

function renderPresetList() {
  const list = document.getElementById('presetList');
  if (!list) return;
  const presets = getSavedPresets();
  const names = Object.keys(presets).filter(n => n !== '__autosave__').sort();
  if (names.length === 0) {
    list.innerHTML = '<div class="preset-empty">No saved presets yet.<br>Tap "+ SAVE" to save current state.</div>';
    return;
  }
  list.innerHTML = '';
  names.forEach(name => {
    const p = presets[name];
    const date = p.timestamp ? new Date(p.timestamp).toLocaleDateString() + ' ' + new Date(p.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    const notes = (p.notes || []).length;
    const div = document.createElement('div');
    div.className = 'preset-item';
    div.innerHTML = `<div class="preset-item-name">${name}<br><span style="font-size:8px;color:var(--text-dim)">${date} · ${notes} notes</span></div>
      <button class="preset-item-btn" data-action="load" data-name="${name}">LOAD</button>
      <button class="preset-item-btn delete" data-action="delete" data-name="${name}">✕</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll('.preset-item-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      const name = btn.dataset.name;
      if (action === 'load') { loadPreset(name); closePresetPanel(); }
      else if (action === 'delete') { if (confirm('Delete preset "' + name + '"?')) { deletePreset(name); renderPresetList(); } }
    };
  });
}

function savePreset(name) {
  if (!name) return;
  const data = getPresetData();
  data.name = name;
  const presets = getSavedPresets();
  presets[name] = data;
  savePresetsToStorage(presets);
  renderPresetList();
  updateAutosaveInfo();
}
function loadPreset(name) {
  const presets = getSavedPresets();
  if (presets[name]) { setPresetData(presets[name]); return true; }
  return false;
}
function deletePreset(name) {
  const presets = getSavedPresets();
  delete presets[name];
  savePresetsToStorage(presets);
}

// --- auto-save ---
function triggerAutoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    const data = getPresetData();
    data.name = '__autosave__';
    const presets = getSavedPresets();
    presets['__autosave__'] = data;
    savePresetsToStorage(presets);
    updateAutosaveInfo();
  }, 1500);
}
function updateAutosaveInfo() {
  const el = document.getElementById('presetAutosave');
  if (!el) return;
  const presets = getSavedPresets();
  const a = presets['__autosave__'];
  if (a) {
    const t = a.timestamp ? new Date(a.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : '';
    const notes = (a.notes || []).length;
    el.textContent = 'Auto-save: ' + t + ' · ' + notes + ' notes · ' + Object.keys(presets).filter(n => n !== '__autosave__').length + ' presets saved';
  } else {
    el.textContent = 'No auto-save yet';
  }
}

// --- file export/import ---
function exportAllPresets() {
  const presets = getSavedPresets();
  const data = JSON.stringify(presets, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hacktribe_presets_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importPresetsFromFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      let count = 0;
      if (data.v === 1 && data.name) {
        // Single preset file
        const presets = getSavedPresets();
        presets[data.name] = data;
        savePresetsToStorage(presets);
        count = 1;
      } else if (typeof data === 'object' && !data.v) {
        // Multiple presets file (full export)
        const presets = getSavedPresets();
        Object.keys(data).forEach(k => { if (k !== '__autosave__') { presets[k] = data[k]; count++; } });
        savePresetsToStorage(presets);
      }
      if (count > 0) { renderPresetList(); alert('Imported ' + count + ' preset(s)'); }
      else { alert('No valid presets found in file'); }
    } catch { alert('Error reading file'); }
  };
  reader.readAsText(file);
}

// --- panel open/close ---
function openPresetPanel() {
  const panel = document.getElementById('presetPanel');
  if (panel) { panel.classList.add('open'); renderPresetList(); updateAutosaveInfo(); }
}
function closePresetPanel() {
  const panel = document.getElementById('presetPanel');
  if (panel) panel.classList.remove('open');
}

// --- PWA install ---
function installPWA() {
  if (!state._deferredInstallPrompt) {
    alert('To install: Chrome menu > "Install app" or "Add to Home screen"');
    return;
  }
  state._deferredInstallPrompt.prompt();
  state._deferredInstallPrompt.userChoice.then(result => {
    if (result.outcome === 'accepted') {
      console.log('PWA installed');
      const btn = document.getElementById('btnInstall');
      if (btn) btn.style.display = 'none';
    }
    state._deferredInstallPrompt = null;
  });
}

// ==================== START ====================
window.addEventListener('DOMContentLoaded', init);
</script>
